<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
    <title>Bảng tổng hợp lịch họp - VPT Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0..1,0&display=block">
    <link rel="stylesheet" href="assets/vpt.css">
    <script src="assets/vpt.js"></script>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>
</head>
<body>
    <header class="topbar">
        <div class="crumbs">
            <a class="icon-btn" href="meeting.html" aria-label="Quay lại"><span class="ms">arrow_back</span></a>
            <a href="meeting.html" style="color:var(--muted);text-decoration:none;white-space:nowrap">Phòng họp</a><span class="sep">/</span>
            <span class="cur">Bảng tổng hợp lịch họp</span>
        </div>
    </header>

    <div class="content">
        <section id="view-summary">
            <div class="sum-head">
                <div><p class="eyebrow">Bảng tổng hợp</p><h2 class="h2" id="table-title">Lịch đăng ký sử dụng phòng họp</h2></div>
                <div class="monthnav">
                    <button class="icon-btn" id="m-prev" aria-label="Tháng trước"><span class="ms">chevron_left</span></button>
                    <div class="wk-label"><span class="ms">calendar_month</span><span id="m-text"></span></div>
                    <button class="icon-btn" id="m-next" aria-label="Tháng sau"><span class="ms">chevron_right</span></button>
                </div>
            </div>
            <div class="stats" id="stats"></div>
            <div class="filters">
                <div class="seg" id="room-filter" role="group" aria-label="Lọc theo phòng"></div>
                <select class="input" id="dept-filter" aria-label="Lọc theo phòng ban"></select>
                <input class="input" id="sum-search" placeholder="Tìm nội dung hoặc người đặt…" aria-label="Tìm kiếm">
            </div>
            <div class="table-wrap">
                <table class="sum-table">
                    <thead><tr><th style="width:64px;text-align:center">Tuần</th><th style="width:90px">Ngày</th><th style="width:130px">Thời gian</th><th style="width:150px">Phòng</th><th style="width:170px">Phòng ban</th><th>Nội dung</th><th style="width:170px">Người đặt</th></tr></thead>
                    <tbody id="table-body"><tr><td colspan="7"><div class="loading"><span class="ms">progress_activity</span>Đang tải dữ liệu…</div></td></tr></tbody>
                </table>
            </div>
            <div class="sum-cards" id="sum-cards"></div>
        </section>
    </div>

    <div class="toast" id="toast" hidden><span class="ms fill">check_circle</span><span id="toast-tx"></span></div>

    <script src="summary.js"></script>
</body>
</html>
