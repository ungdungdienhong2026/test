<!DOCTYPE html>
<html class="dark" lang="vi">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Quản Lý Phòng Họp - Suất Ăn</title>
    <meta property="og:title" content="Quản Lý Phòng Họp - Suất Ăn" />
    <meta property="og:description" content="Hệ thống quản lý nội bộ tích hợp" />
    <meta property="og:type" content="website" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Hanken+Grotesk:wght@500;600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        background: "#0b1326",
                        surface: "#171f33",
                        primary: "#c0c1ff",
                        "primary-hover": "#8083ff",
                        "on-surface": "#dae2fd",
                        "surface-highlight": "#2d3449"
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        display: ['Hanken Grotesk', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #0b1326;
            color: #dae2fd;
        }
        .nav-item {
            transition: all 0.3s ease;
            border: 2px solid transparent;
        }
        .nav-item.active {
            background-color: rgba(192, 193, 255, 0.15);
            color: #c0c1ff;
        }
        .nav-item:hover:not(.active) {
            background-color: rgba(255, 255, 255, 0.05);
        }
        @media (min-width: 768px) {
            .nav-item {
                border: none;
                border-left: 4px solid transparent;
            }
            .nav-item.active {
                border-left: 4px solid #c0c1ff;
            }
        }
        iframe {
            border: none;
            width: 100%;
            height: 100%;
        }
        
        /* Loading overlay for iframe */
        #iframe-loader {
            transition: opacity 0.3s ease;
        }
    </style>
</head>
<body class="flex flex-col md:flex-row h-screen overflow-hidden">
    <!-- Sidebar / Bottom Nav -->
    <aside class="w-full md:w-64 h-auto md:h-full bg-surface border-t md:border-t-0 md:border-r border-white/10 flex flex-col z-10 shadow-2xl shrink-0 order-last md:order-first" style="padding-bottom: env(safe-area-inset-bottom);">
        <!-- Logo / Title -->
        <div class="hidden md:flex h-16 items-center justify-center border-b border-white/10 bg-gradient-to-r from-surface to-background/50">
            <span class="material-symbols-outlined text-primary text-3xl mr-3 shadow-primary">admin_panel_settings</span>
            <h1 class="font-display text-xl font-bold tracking-wide text-white">VPT Portal</h1>
        </div>

        <!-- Navigation -->
        <nav class="py-2 md:flex-1 md:py-6 flex flex-row md:flex-col gap-2 px-2 md:px-3 justify-center">
            <p class="hidden md:block px-4 text-xs font-semibold text-on-surface/40 uppercase tracking-wider mb-2">Chức năng</p>
            <button onclick="switchApp('meeting')" id="nav-meeting" class="nav-item active flex-1 md:flex-none flex flex-col md:flex-row items-center justify-center md:justify-start px-2 md:px-4 py-2 md:py-3 rounded-xl md:rounded-none md:rounded-r-lg text-center md:text-left text-on-surface/80 font-medium">
                <span class="material-symbols-outlined md:mr-3 mb-1 md:mb-0 text-2xl md:text-[24px]">meeting_room</span>
                <span class="text-[11px] md:text-base whitespace-nowrap">Phòng Họp</span>
            </button>
            <button onclick="switchApp('mealapp')" id="nav-mealapp" class="nav-item flex-1 md:flex-none flex flex-col md:flex-row items-center justify-center md:justify-start px-2 md:px-4 py-2 md:py-3 rounded-xl md:rounded-none md:rounded-r-lg text-center md:text-left text-on-surface/80 font-medium">
                <span class="material-symbols-outlined md:mr-3 mb-1 md:mb-0 text-2xl md:text-[24px]">restaurant</span>
                <span class="text-[11px] md:text-base whitespace-nowrap">Suất Ăn</span>
            </button>
            <button onclick="switchApp('drinks')" id="nav-drinks" class="nav-item flex-1 md:flex-none flex flex-col md:flex-row items-center justify-center md:justify-start px-2 md:px-4 py-2 md:py-3 rounded-xl md:rounded-none md:rounded-r-lg text-center md:text-left text-on-surface/80 font-medium">
                <span class="material-symbols-outlined md:mr-3 mb-1 md:mb-0 text-2xl md:text-[24px]">local_cafe</span>
                <span class="text-[11px] md:text-base whitespace-nowrap">Đồ Uống</span>
            </button>
        </nav>
    </aside>

    <!-- Main Content Area -->
    <main class="flex-1 relative bg-background">
        <!-- Loader -->
        <div id="iframe-loader" class="absolute inset-0 z-20 flex items-center justify-center bg-background pointer-events-none opacity-0 hidden">
            <div class="flex flex-col items-center">
                <div class="animate-spin rounded-full h-12 w-12 border-4 border-primary border-t-transparent mb-4"></div>
                <p class="text-primary font-medium animate-pulse">Đang tải ứng dụng...</p>
            </div>
        </div>
        
        <iframe id="app-frame" src="meeting.html" title="Application Frame" onload="hideLoader()"></iframe>
    </main>

    <script>
        function showLoader() {
            const loader = document.getElementById('iframe-loader');
            loader.classList.remove('hidden');
            setTimeout(() => loader.style.opacity = '1', 10);
        }

        function hideLoader() {
            const loader = document.getElementById('iframe-loader');
            loader.style.opacity = '0';
            setTimeout(() => loader.classList.add('hidden'), 300);
        }

        function switchApp(app) {
            // Cập nhật UI menu
            document.querySelectorAll('.nav-item').forEach(el => {
                el.classList.remove('active');
            });
            document.getElementById(`nav-${app}`).classList.add('active');

            // Hiển thị Loader
            showLoader();

            // Đổi nguồn iframe
            const frame = document.getElementById('app-frame');
            const cacheBuster = new Date().getTime();
            if (app === 'meeting') {
                frame.src = `meeting.html?v=${cacheBuster}`;
            } else if (app === 'mealapp') {
                frame.src = `mealapp.html?v=${cacheBuster}`;
            } else if (app === 'drinks') {
                frame.src = `drinks.html?v=${cacheBuster}`;
            }
        }
    </script>
</body>
</html>
