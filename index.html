<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
    <title>VPT Portal - Phòng Họp · Suất Ăn · Đồ Uống</title>
    <meta property="og:title" content="VPT Portal" />
    <meta property="og:description" content="Hệ thống quản lý nội bộ tích hợp" />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#0b1326" />
    <link rel="icon" href="public/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0..1,0&display=block">
    <link rel="stylesheet" href="assets/vpt.css?v=3">
    <script src="assets/vpt.js"></script>
    <style>
        /* Portal: thanh điều hướng + khung iframe chạy từng ứng dụng */
        html,body{height:100%;overflow:hidden}
        .portal{display:flex;height:100%}
        .portal .rail{height:100%;position:relative}
        .portal .frame{flex:1;min-width:0;position:relative;background:var(--bg)}
        .portal iframe{border:0;width:100%;height:100%;display:block;background:var(--bg)}
        #iframe-loader{position:absolute;inset:0;z-index:5;display:grid;place-items:center;background:var(--bg);transition:opacity .25s;pointer-events:none}
        #iframe-loader.hide{opacity:0}
        .spinner{width:44px;height:44px;border-radius:50%;border:4px solid var(--line);border-top-color:var(--accent);animation:spin .8s linear infinite;margin:0 auto 14px}
        #iframe-loader p{color:var(--muted);font-size:14px;text-align:center}
        @media (max-width:820px){
            /* Điện thoại: thanh điều hướng nằm dưới, trong luồng để iframe không bị che */
            .portal{flex-direction:column}
            .portal .rail{position:relative;inset:auto;order:2;height:auto;flex-shrink:0}
            .portal .frame{flex:1;min-height:0}
        }
    </style>
</head>
<body class="portal">
    <nav class="rail" aria-label="Chức năng">
        <div class="brand"><span class="brand-mark"><span class="ms fill">admin_panel_settings</span></span><div><b>VPT Portal</b><small>Hệ thống nội bộ</small></div></div>
        <p class="cap lbl">Chức năng</p>
        <button class="nav" id="nav-meeting" data-app="meeting"><span class="ms">meeting_room</span><span>Phòng Họp</span></button>
        <button class="nav" id="nav-mealapp" data-app="mealapp"><span class="ms">restaurant</span><span>Suất Ăn</span></button>
        <button class="nav" id="nav-drinks" data-app="drinks"><span class="ms">local_cafe</span><span>Đồ Uống</span></button>
        <div class="rail-foot">
            <button class="nav" id="theme-btn" aria-label="Đổi giao diện sáng/tối"><span class="ms" id="theme-ic">dark_mode</span><span id="theme-tx">Giao diện tối</span></button>
        </div>
    </nav>

    <main class="frame">
        <div id="iframe-loader">
            <div><div class="spinner"></div><p>Đang tải ứng dụng...</p></div>
        </div>
        <iframe id="app-frame" src="about:blank" title="Application Frame"></iframe>
    </main>

    <script>
        const APPS = { meeting: 'meeting.html', mealapp: 'mealapp.html', drinks: 'drinks.html' };
        const frame = document.getElementById('app-frame');
        const loader = document.getElementById('iframe-loader');
        let loaderT;

        function showLoader() { clearTimeout(loaderT); loader.hidden = false; requestAnimationFrame(() => loader.classList.remove('hide')); }
        function hideLoader() { loader.classList.add('hide'); loaderT = setTimeout(() => loader.hidden = true, 260); }
        frame.addEventListener('load', hideLoader);

        function switchApp(app) {
            if (!APPS[app]) app = 'mealapp';
            document.querySelectorAll('.rail > .nav').forEach(el => el.classList.toggle('on', el.dataset.app === app));
            showLoader();
            frame.src = `${APPS[app]}?v=${Date.now()}`;
            VPT.store.set('vpt_last_app', app);
            // Cho phép mở thẳng một ứng dụng bằng #meeting / #mealapp / #drinks
            if (location.hash !== '#' + app) history.replaceState(null, '', '#' + app);
        }
        document.querySelectorAll('.rail > .nav').forEach(el => el.addEventListener('click', () => switchApp(el.dataset.app)));
        window.addEventListener('hashchange', () => { const a = location.hash.slice(1); if (APPS[a] && !frame.src.includes(APPS[a])) switchApp(a); });

        // Giao diện sáng / tối (đồng bộ sang các ứng dụng con qua localStorage)
        function paintTheme() {
            const dark = VPT.effTheme() === 'dark';
            document.getElementById('theme-ic').textContent = dark ? 'light_mode' : 'dark_mode';
            document.getElementById('theme-tx').textContent = dark ? 'Giao diện sáng' : 'Giao diện tối';
        }
        document.getElementById('theme-btn').addEventListener('click', () => {
            VPT.setTheme(VPT.effTheme() === 'dark' ? 'light' : 'dark');
            paintTheme();
            // Báo cho iframe cùng origin (sự kiện storage không bắn trong chính tab đang ghi)
            try { frame.contentDocument.documentElement.dataset.theme = document.documentElement.dataset.theme; } catch (e) {}
        });
        VPT.mq.addEventListener && VPT.mq.addEventListener('change', paintTheme);
        paintTheme();

        // Ứng dụng mặc định: theo #hash, rồi lần mở trước, mặc định Suất Ăn
        const start = location.hash.slice(1);
        switchApp(APPS[start] ? start : (VPT.store.get('vpt_last_app') || 'mealapp'));
    </script>
</body>
</html>
