<!DOCTYPE html>
<html class="dark" lang="vi">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Đặt Phòng Họp - Premium Booking</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Hanken+Grotesk:wght@500;600;700&family=Geist:wght@400;600&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "tertiary-fixed-dim": "#d0bcff",
                        "on-surface-variant": "#c7c4d7",
                        "secondary-fixed": "#c9e6ff",
                        "on-secondary-fixed": "#001e2f",
                        "on-tertiary-fixed-variant": "#5516be",
                        "on-tertiary": "#3c0091",
                        "on-primary": "#1000a9",
                        "primary": "#c0c1ff",
                        "surface-variant": "#2d3449",
                        "surface-container-low": "#131b2e",
                        "on-surface": "#dae2fd",
                        "primary-fixed": "#e1e0ff",
                        "surface-container": "#171f33",
                        "outline-variant": "#464554",
                        "inverse-primary": "#494bd6",
                        "surface-container-high": "#222a3d",
                        "tertiary": "#d0bcff",
                        "surface": "#0b1326",
                        "inverse-surface": "#dae2fd",
                        "outline": "#908fa0",
                        "secondary-container": "#00a2e6",
                        "primary-container": "#8083ff",
                        "on-primary-fixed-variant": "#2f2ebe",
                        "secondary-fixed-dim": "#89ceff",
                        "on-primary-fixed": "#07006c",
                        "surface-container-highest": "#2d3449",
                        "on-error-container": "#ffdad6",
                        "surface-bright": "#31394d",
                        "background": "#0b1326",
                        "inverse-on-surface": "#283044",
                        "error-container": "#93000a",
                        "on-secondary": "#00344d",
                        "tertiary-container": "#a078ff",
                        "error": "#ffb4ab",
                        "secondary": "#89ceff",
                        "on-tertiary-container": "#340080",
                        "tertiary-fixed": "#e9ddff",
                        "on-tertiary-fixed": "#23005c",
                        "surface-tint": "#c0c1ff",
                        "primary-fixed-dim": "#c0c1ff",
                        "surface-container-lowest": "#060e20",
                        "on-error": "#690005",
                        "on-secondary-container": "#00344e",
                        "on-primary-container": "#0d0096",
                        "surface-dim": "#0b1326",
                        "on-secondary-fixed-variant": "#004c6e",
                        "on-background": "#dae2fd"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "gutter": "24px",
                        "base": "8px",
                        "container-max-width": "1280px",
                        "margin-mobile": "20px",
                        "margin-desktop": "64px"
                    },
                    "fontFamily": {
                        "mono-data": ["Geist"],
                        "headline-lg-mobile": ["Hanken Grotesk"],
                        "title-md": ["Hanken Grotesk"],
                        "body-sm": ["Inter"],
                        "label-caps": ["Geist"],
                        "display-lg": ["Hanken Grotesk"],
                        "headline-lg": ["Hanken Grotesk"],
                        "body-md": ["Inter"]
                    },
                    "fontSize": {
                        "mono-data": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                        "headline-lg-mobile": ["24px", {"lineHeight": "32px", "fontWeight": "600"}],
                        "title-md": ["20px", {"lineHeight": "28px", "fontWeight": "500"}],
                        "body-sm": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                        "label-caps": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600"}],
                        "display-lg": ["48px", {"lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                        "headline-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "600"}],
                        "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}]
                    }
                },
            },
        }
    </script>
    <style>
        .glass-card {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
        }
        
        .glass-card:hover {
            border-color: rgba(192, 193, 255, 0.3);
            background: rgba(15, 23, 42, 0.7);
        }

        .selected-glow {
            box-shadow: 0px 0px 20px rgba(99, 102, 241, 0.25);
            border-color: #c0c1ff !important;
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .transition-soft {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Dynamic Department Colors */
        .booked-slot {
            border-color: rgba(var(--dept-rgb), 0.3);
            background-color: rgba(var(--dept-rgb), 0.1);
            box-shadow: 0 0 15px rgba(var(--dept-rgb), 0.1);
        }
        .booked-slot:hover {
            box-shadow: 0 0 20px rgba(var(--dept-rgb), 0.3);
            background-color: rgba(var(--dept-rgb), 0.2);
        }
        .booked-tag {
            color: var(--dept-color);
            border-color: rgba(var(--dept-rgb), 0.3);
            background-color: rgba(var(--dept-rgb), 0.1);
            box-shadow: 0 0 8px rgba(var(--dept-rgb), 0.2);
        }
        .booked-line-through {
            text-decoration-color: rgba(var(--dept-rgb), 0.5);
        }
        body {
            min-height: max(884px, 100dvh);
        }
    </style>
</head>
<body class="bg-background text-on-background font-body-md min-h-screen pb-24">
    <!-- Top App Bar -->
    <header class="bg-surface/60 backdrop-blur-xl border-b border-white/10 docked full-width top-0 sticky flex justify-between items-center px-margin-mobile h-16 w-full z-50">
        <div class="flex items-center gap-4">
            <button class="text-primary hover:bg-white/5 p-2 rounded-full transition-colors active:scale-95 duration-200">
                <span class="material-symbols-outlined">arrow_back</span>
            </button>
            <h1 class="text-on-surface font-headline-lg-mobile text-headline-lg-mobile font-bold">Phòng họp</h1>
        </div>
        <div class="flex items-center gap-2">
            <button class="text-on-surface-variant hover:bg-white/5 p-2 rounded-full transition-colors">
                <span class="material-symbols-outlined">map</span>
            </button>
            <div class="w-8 h-8 rounded-full bg-primary-container flex items-center justify-center text-on-primary-container font-bold text-xs">
                JD
            </div>
        </div>
    </header>

    <main class="max-w-container-max-width mx-auto px-margin-mobile md:px-margin-desktop py-8">
        <!-- Header Section -->
        <div class="flex justify-between items-end mb-8">
            <div>
                <h2 class="font-headline-lg text-headline-lg text-primary tracking-tight">Chọn ngày</h2>
                <p class="text-on-surface-variant font-body-sm mt-1">Lên lịch họp chuyên nghiệp và dễ dàng</p>
            </div>
            <div class="relative flex items-center gap-2 bg-surface-container-high px-4 py-2 rounded-xl border border-white/5 cursor-pointer hover:bg-white/5 transition-soft" id="month-btn">
                <span class="material-symbols-outlined text-primary text-sm">calendar_month</span>
                <span class="font-label-caps text-label-caps text-on-surface" id="current-month-display">Tháng 6, 2024</span>
                <input type="date" id="date-picker" class="absolute w-0 h-0 opacity-0 pointer-events-none" />
            </div>
        </div>

        <!-- Date Horizontal Picker -->
        <div class="relative mb-12">
            <div id="dates-container" class="flex overflow-x-auto gap-4 no-scrollbar pb-4 scroll-smooth">
                <!-- JS injected dates -->
            </div>
            <div class="absolute right-0 top-0 bottom-4 w-12 bg-gradient-to-l from-background to-transparent pointer-events-none"></div>
        </div>

        <!-- Status Legend -->
        <div class="flex flex-wrap gap-6 mb-8 items-center px-2">
            <div class="flex items-center gap-2">
                <span class="w-2.5 h-2.5 rounded-full border border-primary animate-pulse"></span>
                <span class="font-label-caps text-label-caps text-on-surface-variant uppercase">Trống</span>
            </div>
            <div class="flex items-center gap-2">
                <span class="w-2.5 h-2.5 rounded-full shadow-[0_0_8px_rgba(255,255,255,0.4)]" style="background: conic-gradient(#00f0ff, #ff00ff, #ffea00, #ff5e00, #00ff00, #ff0055, #b200ff, #00f0ff);"></span>
                <span class="font-label-caps text-label-caps text-on-surface-variant uppercase">Đã đặt</span>
            </div>
            <div class="flex items-center gap-2">
                <span class="w-2.5 h-2.5 rounded-full bg-primary shadow-[0_0_8px_rgba(192,193,255,0.6)]"></span>
                <span class="font-label-caps text-label-caps text-on-surface-variant uppercase">Đang chọn</span>
            </div>
        </div>

        <!-- Time Grid -->
        <div id="slots-container" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
            <!-- JS injected slots -->
        </div>
    </main>

    <!-- Fixed Bottom Action Bar -->
    <div class="fixed bottom-0 left-0 w-full bg-surface/80 backdrop-blur-2xl border-t border-white/5 z-50 px-margin-mobile py-4 pb-safe flex justify-between items-center shadow-lg">
        <div class="flex flex-col">
            <span class="font-label-caps text-label-caps text-on-surface-variant">Phòng họp đã chọn</span>
            <div class="flex items-center gap-2">
                <span class="font-title-md text-title-md text-primary font-semibold" id="selected-count">Chưa chọn khung giờ</span>
            </div>
        </div>
        <button id="next-btn" class="bg-primary hover:bg-primary-container text-on-primary font-label-caps text-label-caps px-8 py-4 rounded-xl shadow-[0_8px_16px_rgba(192,193,255,0.2)] hover:shadow-[0_8px_20px_rgba(192,193,255,0.4)] transition-all duration-300 active:scale-95 flex items-center gap-2 opacity-50 cursor-not-allowed">
            TIẾP THEO
            <span class="material-symbols-outlined text-sm">arrow_forward</span>
        </button>
    </div>

    <!-- Info & Cancel Modal -->
    <div id="info-modal" class="fixed inset-0 z-[100] hidden items-center justify-center p-4">
        <div class="absolute inset-0 bg-background/80 backdrop-blur-sm" onclick="closeInfoModal()"></div>
        <div class="glass-card bg-surface border border-white/10 rounded-2xl p-6 w-full max-w-md relative z-10 shadow-2xl flex flex-col gap-4">
            <h3 class="text-title-md font-title-md text-primary">Thông tin đặt phòng</h3>
            <div class="flex flex-col gap-2 text-body-md text-on-surface">
                <p><span class="text-on-surface-variant font-label-caps">KHUNG GIỜ:</span> <span id="modal-time" class="font-mono-data"></span></p>
                <p><span class="text-on-surface-variant font-label-caps">PHÒNG BAN:</span> <span id="modal-dept" class="font-semibold"></span></p>
                <p><span class="text-on-surface-variant font-label-caps">NGƯỜI ĐẶT:</span> <span id="modal-name" class="font-semibold"></span></p>
                <p><span class="text-on-surface-variant font-label-caps">NỘI DUNG:</span> <span id="modal-purpose"></span></p>
            </div>
            
            <div class="mt-4 pt-4 border-t border-white/10">
                <p class="text-body-sm text-on-surface-variant mb-2">Để hủy khung giờ này, nhập chính xác tên người đặt:</p>
                <input type="text" id="cancel-name-input" class="w-full bg-surface-container-high border border-white/10 rounded-xl px-4 py-2 text-on-surface font-body-md focus:border-error focus:ring-error transition-soft mb-4" placeholder="Nhập tên người đặt...">
                <div class="flex gap-3 justify-end">
                    <button onclick="closeInfoModal()" class="px-4 py-2 rounded-xl text-on-surface hover:bg-white/5 transition-soft">Đóng</button>
                    <button id="confirm-cancel-btn" class="px-4 py-2 rounded-xl bg-error/20 text-error hover:bg-error hover:text-on-error transition-soft border border-error/30 font-semibold">Hủy phòng</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="index.js?v=5"></script>
</body>
</html>
