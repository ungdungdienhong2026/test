<!DOCTYPE html>
<html class="dark" lang="vi">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Cổng Thông Tin - Quản Trị Nội Bộ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Hanken+Grotesk:wght@500;600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        background: "#0b1326",
                        surface: "#171f33",
                        primary: "#c0c1ff",
                        "primary-hover": "#8083ff",
                        "on-surface": "#dae2fd",
                        "surface-highlight": "#2d3449"
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        display: ['Hanken Grotesk', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #0b1326;
            color: #dae2fd;
        }
        .nav-item {
            transition: all 0.3s ease;
        }
        .nav-item.active {
            background-color: rgba(192, 193, 255, 0.15);
            border-left: 4px solid #c0c1ff;
            color: #c0c1ff;
        }
        .nav-item:hover:not(.active) {
            background-color: rgba(255, 255, 255, 0.05);
            border-left: 4px solid transparent;
        }
        .nav-item:not(.active) {
            border-left: 4px solid transparent;
        }
        iframe {
            border: none;
            width: 100%;
            height: 100%;
        }
        
        /* Loading overlay for iframe */
        #iframe-loader {
            transition: opacity 0.3s ease;
        }
    </style>
</head>
<body class="flex h-screen overflow-hidden">
    <!-- Sidebar -->
    <aside class="w-64 bg-surface border-r border-white/10 flex flex-col z-10 shadow-2xl shrink-0">
        <!-- Logo / Title -->
        <div class="h-16 flex items-center justify-center border-b border-white/10 bg-gradient-to-r from-surface to-background/50">
            <span class="material-symbols-outlined text-primary text-3xl mr-3 shadow-primary">admin_panel_settings</span>
            <h1 class="font-display text-xl font-bold tracking-wide text-white">VPT Portal</h1>
        </div>

        <!-- Navigation -->
        <nav class="flex-1 py-6 flex flex-col gap-2 px-3">
            <p class="px-4 text-xs font-semibold text-on-surface/40 uppercase tracking-wider mb-2">Chức năng</p>
            <button onclick="switchApp('meeting')" id="nav-meeting" class="nav-item active flex items-center w-full px-4 py-3 rounded-r-lg text-left text-on-surface/80 font-medium">
                <span class="material-symbols-outlined mr-3">meeting_room</span>
                Quản lý Phòng Họp
            </button>
            <button onclick="switchApp('mealapp')" id="nav-mealapp" class="nav-item flex items-center w-full px-4 py-3 rounded-r-lg text-left text-on-surface/80 font-medium">
                <span class="material-symbols-outlined mr-3">restaurant</span>
                Quản lý Suất Ăn
            </button>
        </nav>


    </aside>

    <!-- Main Content Area -->
    <main class="flex-1 relative bg-background">
        <!-- Loader -->
        <div id="iframe-loader" class="absolute inset-0 z-20 flex items-center justify-center bg-background pointer-events-none opacity-0 hidden">
            <div class="flex flex-col items-center">
                <div class="animate-spin rounded-full h-12 w-12 border-4 border-primary border-t-transparent mb-4"></div>
                <p class="text-primary font-medium animate-pulse">Đang tải ứng dụng...</p>
            </div>
        </div>
        
        <iframe id="app-frame" src="meeting.html" title="Application Frame" onload="hideLoader()"></iframe>
    </main>

    <script>
        function showLoader() {
            const loader = document.getElementById('iframe-loader');
            loader.classList.remove('hidden');
            setTimeout(() => loader.style.opacity = '1', 10);
        }

        function hideLoader() {
            const loader = document.getElementById('iframe-loader');
            loader.style.opacity = '0';
            setTimeout(() => loader.classList.add('hidden'), 300);
        }

        function switchApp(app) {
            // Cập nhật UI menu
            document.querySelectorAll('.nav-item').forEach(el => {
                el.classList.remove('active');
            });
            document.getElementById(`nav-${app}`).classList.add('active');

            // Hiển thị Loader
            showLoader();

            // Đổi nguồn iframe
            const frame = document.getElementById('app-frame');
            const cacheBuster = new Date().getTime();
            if (app === 'meeting') {
                frame.src = `meeting.html?v=${cacheBuster}`;
            } else if (app === 'mealapp') {
                frame.src = `mealapp.html?v=${cacheBuster}`;
            }
        }
    </script>
</body>
</html>
