<!DOCTYPE html>
<html class="light" lang="vi">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Chi tiết đặt phòng - BookRoom</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-primary-fixed-variant": "#0035be",
                        "surface-container-lowest": "#ffffff",
                        "secondary": "#006c4c",
                        "on-background": "#151c22",
                        "primary-fixed-dim": "#b9c3ff",
                        "on-primary-fixed": "#001356",
                        "surface-dim": "#d4dbe3",
                        "inverse-primary": "#b9c3ff",
                        "outline-variant": "#c4c5d7",
                        "surface-tint": "#2c50d9",
                        "tertiary-fixed-dim": "#ffb3ac",
                        "on-tertiary-fixed": "#410003",
                        "on-secondary-fixed": "#002114",
                        "on-error": "#ffffff",
                        "surface-variant": "#dce3ec",
                        "primary-container": "#4263eb",
                        "on-error-container": "#93000a",
                        "on-primary-container": "#f5f3ff",
                        "on-surface-variant": "#444654",
                        "surface-container-highest": "#dce3ec",
                        "primary-fixed": "#dde1ff",
                        "error": "#ba1a1a",
                        "primary": "#2248d1",
                        "on-primary": "#ffffff",
                        "on-secondary-container": "#007351",
                        "inverse-surface": "#2a3138",
                        "surface-container-low": "#eef4fd",
                        "inverse-on-surface": "#ebf1fa",
                        "tertiary": "#b20416",
                        "tertiary-container": "#d6292b",
                        "secondary-fixed": "#88f8c6",
                        "on-tertiary": "#ffffff",
                        "tertiary-fixed": "#ffdad6",
                        "on-tertiary-container": "#fff1f0",
                        "outline": "#747686",
                        "surface-container": "#e8eef7",
                        "secondary-fixed-dim": "#6bdbab",
                        "secondary-container": "#88f8c6",
                        "on-secondary-fixed-variant": "#005138",
                        "on-surface": "#151c22",
                        "error-container": "#ffdad6",
                        "background": "#f6f9ff",
                        "on-secondary": "#ffffff",
                        "surface-container-high": "#e2e9f1",
                        "surface-bright": "#f6f9ff",
                        "surface": "#f6f9ff",
                        "on-tertiary-fixed-variant": "#93000f"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "gutter": "16px",
                        "stack-sm": "8px",
                        "container-padding": "24px",
                        "base-unit": "4px",
                        "stack-md": "16px",
                        "margin-desktop": "48px",
                        "stack-lg": "32px",
                        "margin-mobile": "16px"
                    },
                    "fontFamily": {
                        "body-md": ["Inter"],
                        "label-md": ["Inter"],
                        "headline-lg": ["Inter"],
                        "headline-lg-mobile": ["Inter"],
                        "body-lg": ["Inter"],
                        "title-md": ["Inter"],
                        "button-text": ["Inter"],
                        "headline-xl": ["Inter"]
                    },
                    "fontSize": {
                        "body-md": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                        "label-md": ["12px", {"lineHeight": "16px", "letterSpacing": "0.02em", "fontWeight": "500"}],
                        "headline-lg": ["24px", {"lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600"}],
                        "headline-lg-mobile": ["20px", {"lineHeight": "28px", "fontWeight": "600"}],
                        "body-lg": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                        "title-md": ["18px", {"lineHeight": "24px", "fontWeight": "600"}],
                        "button-text": ["14px", {"lineHeight": "20px", "fontWeight": "600"}],
                        "headline-xl": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700"}]
                    }
                },
            },
        }
    </script>
    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            vertical-align: middle;
        }
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        .transition-soft {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        body { min-height: max(884px, 100dvh); }
    </style>
</head>
<body class="bg-background text-on-background font-body-md min-h-screen pb-32">
    <!-- Top Navigation Bar -->
    <header class="bg-primary dark:bg-primary-container text-on-primary dark:text-on-primary-container flex justify-between items-center w-full px-margin-mobile py-4 sticky top-0 z-50 shadow-sm transition-soft">
        <div class="flex items-center gap-3">
            <button aria-label="Go back" class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-white/10 transition-colors">
                <span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
            </button>
            <h1 class="text-headline-lg-mobile font-headline-lg-mobile font-bold">Phòng họp</h1>
        </div>
        <div class="flex items-center gap-2">
            <button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-white/10 transition-colors">
                <span class="material-symbols-outlined" data-icon="location_on">location_on</span>
            </button>
        </div>
    </header>

    <main class="max-w-[1140px] mx-auto">
        <!-- Hero Image Section Removed -->

        <!-- Date Selector -->
        <section class="px-margin-mobile md:px-margin-desktop py-6">
            <div class="flex items-center justify-between mb-4">
                <h2 class="text-title-md font-title-md">Chọn ngày</h2>
                <div class="relative flex items-center">
                    <button id="month-btn" class="text-primary font-button-text flex items-center gap-1 cursor-pointer hover:opacity-80 transition-soft">
                        <span class="material-symbols-outlined text-[18px]" data-icon="calendar_month">calendar_month</span>
                        <span id="current-month-display">Tháng</span>
                    </button>
                    <input type="date" id="date-picker" class="absolute w-0 h-0 opacity-0 pointer-events-none" />
                </div>
            </div>
            <!-- Date list container -->
            <div id="dates-container" class="flex gap-3 overflow-x-auto hide-scrollbar pb-2">
                <!-- Sẽ được tạo động bằng JS -->
            </div>
        </section>

        <!-- Status Legend -->
        <section class="px-margin-mobile md:px-margin-desktop py-2 flex gap-6">
            <div class="flex items-center gap-2">
                <div class="w-3 h-3 rounded-full border-2 border-secondary bg-white"></div>
                <span class="text-body-md font-body-md text-on-surface-variant">Trống</span>
            </div>
            <div class="flex items-center gap-2">
                <div class="w-3 h-3 rounded-full bg-tertiary"></div>
                <span class="text-body-md font-body-md text-on-surface-variant">Đã đặt</span>
            </div>
            <div class="flex items-center gap-2">
                <div class="w-3 h-3 rounded-full bg-primary"></div>
                <span class="text-body-md font-body-md text-on-surface-variant">Đang chọn</span>
            </div>
        </section>

        <!-- Time Slot Grid -->
        <section class="px-margin-mobile md:px-margin-desktop py-6">
            <div id="slots-container" class="grid grid-cols-2 gap-3">
                <!-- Slots sẽ được tạo động bằng JS -->
            </div>
        </section>
    </main>

    <!-- Footer Action -->
    <footer class="fixed bottom-0 left-0 w-full bg-white border-t border-outline-variant p-4 flex flex-col md:flex-row md:justify-center gap-4 z-50 shadow-[0_-4px_12px_rgba(0,0,0,0.05)]">
        <div class="max-w-[1140px] w-full mx-auto flex items-center justify-between">
            <div class="hidden md:flex flex-col">
                <span class="text-label-md font-label-md text-on-surface-variant">Phòng họp</span>
                <span class="text-body-md font-body-md font-bold text-primary" id="selected-count">Chưa chọn khung giờ</span>
            </div>
            <button id="next-btn" class="w-full md:w-auto md:min-w-[240px] py-4 px-8 rounded-full bg-primary text-on-primary text-button-text font-button-text shadow-md hover:opacity-90 active:scale-95 transition-all opacity-50 cursor-not-allowed">
                Tiếp theo
            </button>
        </div>
    </footer>

    <!-- Firebase SDK (Compat Version để chạy được trên file://) -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>
    
    <script src="index.js"></script>
</body>
</html>
