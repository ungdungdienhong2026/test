<body class="bg-background text-on-background font-body-md selection:bg-primary/30 min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        // --- 1. FIREBASE CONFIG ---
        const firebaseConfig = {
            apiKey: "AIzaSyDn2ViF16E55B311bunMSA-Dn8eDhFYJ_c",
            authDomain: "quanlysuatan.firebaseapp.com",
            databaseURL: "https://quanlysuatan-default-rtdb.firebaseio.com",
            projectId: "quanlysuatan",
            storageBucket: "quanlysuatan.firebasestorage.app",
            messagingSenderId: "1018268550131",
            appId: "1:1018268550131:web:d2aa1c663b6d18e17e4886"
        };
        const isConfigured = firebaseConfig.apiKey !== "DÁN_API_KEY_CỦA_BẠN_VÀO_ĐÂY";
        let database, auth;

        if (isConfigured) {
            firebase.initializeApp(firebaseConfig);
            database = firebase.database();
            auth = firebase.auth();
        }

        const { useState, useEffect, useRef } = React;
        const { ConfigProvider, Form, Input, DatePicker, message, Spin, theme } = antd;

        const MealToggle = React.memo(({ value, onChange, disabled, type }) => {
            const isChecked = !!value;
            return (
                <div
                    onClick={() => !disabled && onChange && onChange(!isChecked ? 'x' : '')}
                    className={`w-6 h-6 flex items-center justify-center rounded cursor-pointer transition-all mx-auto ${disabled ? 'opacity-50 cursor-not-allowed' : 'hover:scale-[1.05] hover:shadow-md'
                        } ${isChecked
                            ? (type === 'trua' ? 'bg-primary text-slate-950 shadow-[0_0_10px_rgba(79,219,200,0.5)]' : 'bg-tertiary text-slate-950 shadow-[0_0_10px_rgba(243,135,100,0.5)]')
                            : 'bg-slate-800/50 border border-slate-700/50 text-transparent'
                        }`}
                >
                    {isChecked && <span className="material-symbols-outlined text-[16px] font-bold">check</span>}
                </div>
            );
        });

        const App = () => {
            const [form] = Form.useForm();
            const [loading, setLoading] = useState(false);
            const [dataLoaded, setDataLoaded] = useState(false);

            const [selectedDate, setSelectedDate] = useState(dayjs());
            const currentWeekKey = selectedDate.format('YYYY-[w]ww');
            const [isLocked, setIsLocked] = useState(true);
            const [activeTab, setActiveTab] = useState('meal-board');
            const [screenshotMode, setScreenshotMode] = useState(false);

            const [selectedReportMonth, setSelectedReportMonth] = useState(dayjs());
            const [monthlyReportData, setMonthlyReportData] = useState([]);
            const [reportLoading, setReportLoading] = useState(false);

            // DANH SÁCH EMAIL ĐƯỢC PHÉP TRUY CẬP HỆ THỐNG
            const ALLOWED_EMAILS = [
                'xuanbactran196@gmail.com',
                'admin@gmail.com',
                'luu2004vp@gmail.com',
                'phanhuutruong273@gmail.com',
                'thanhhai.dienhong@gmail.com',
                'qvu3507@gmail.com',
                'dotranhothang@gmail.com',
                'phamthuhacshb@gmail.com',
                'camhuyendienhong@gmail.com',
                'vanhuong131087hp@gmail.com',
                'thuyquynh0327@gmail.com',
                'ngoctungcon@gmail.com',
                'nguyenthuy19772003@gmail.com',
                'songnguyetle.work@gmail.com',
                'tthangdh2022@gmail.com',
                'vdlnguyenha@gmail.com',
                'maithihoangyen1512dhcn@gmail.com',
                'ngattt3@gmail.com',
                'ngocanhvp1701.vnu@gmail.com',
                'honghai.dienhong@gmail.com',
                'hanhnt016@gmail.com',
                'ntth522@gmail.com',
                'ntth2252000@gmail.com',
                'lybuidienhong28@gmail.com',
                'vuhoangchinh2501@gmail.com',
                'lanvu2727@gmail.com'
            ];
            const [userAuth, setUserAuth] = useState(null);
            const [checkingAuth, setCheckingAuth] = useState(true);

            const isCurrentWeek = currentWeekKey === dayjs().format('YYYY-[w]ww');
            const currentDayNumber = dayjs().day();
            const todayIndex = currentDayNumber === 0 ? 6 : currentDayNumber - 1;

            const employeesData = Form.useWatch('employees', form);

            useEffect(() => {
                if (!isConfigured) {
                    setCheckingAuth(false);
                    return;
                }
                const unsubscribe = auth.onAuthStateChanged((user) => {
                    if (user) {
                        if (ALLOWED_EMAILS.includes(user.email)) {
                            setUserAuth(user);
                            setIsLocked(false); // Vừa vào mặc định mở khóa
                        } else {
                            auth.signOut();
                            message.error(`Email ${user.email} KHÔNG ĐƯỢC CẤP QUYỀN TRUY CẬP!`, 5);
                            setUserAuth(null);
                        }
                    } else {
                        setUserAuth(null);
                        setIsLocked(true);
                    }
                    setCheckingAuth(false);
                });
                return () => unsubscribe();
            }, []);

            useEffect(() => {
                if (!isConfigured) return;
                setDataLoaded(false);

                const dbRef = database.ref(`meal-registration/${currentWeekKey}`);
                const listener = dbRef.on('value', async (snapshot) => {
                    const data = snapshot.val();
                    if (data && data.employees) {
                        form.setFieldsValue({
                            employees: data.employees,
                        });
                        setTimeout(() => { if (isLocked) message.success(`Đã tải dữ liệu Tuần ${currentWeekKey.split('-w')[1]}`); }, 500);
                        setDataLoaded(true);
                    } else {
                        // LOGIC BỐC DANH SÁCH NHÂN SỰ TỪ TUẦN LIỀN TRƯỚC:
                        const prevWeekLocalDate = selectedDate.subtract(1, 'week');
                        const prevWeekKey = prevWeekLocalDate.format('YYYY-[w]ww');

                        try {
                            const prevSnapshot = await database.ref(`meal-registration/${prevWeekKey}`).once('value');
                            const prevData = prevSnapshot.val();

                            if (prevData && prevData.employees) {
                                // Xóa ô tick cơm, chỉ giữ Mã NV (id) và Tên NV (name)
                                const cleanedRoster = prevData.employees.map(emp => {
                                    if (!emp) return { id: '', name: '' };
                                    return {
                                        id: emp.id || '',
                                        name: emp.name || ''
                                    };
                                });
                                form.setFieldsValue({ employees: cleanedRoster });
                                message.info(`Đã bốc danh sách nhân sự từ Tuần ${prevWeekKey.split('-w')[1]} đưa sang Tuần Mới!`);

                                // Auto lưu khung sườn vào tuần mới này luôn (nếu bạn đang Unlock)
                                if (!isLocked) {
                                    await dbRef.set({
                                        employees: cleanedRoster,
                                        lastUpdated: new Date().toISOString()
                                    });
                                }
                            } else {
                                form.setFieldsValue({
                                    employees: [{ id: 'VMP-001', name: 'Đỗ Trần Hồ Thắng' }],
                                });
                            }
                        } catch (error) {
                            form.setFieldsValue({
                                employees: [{ id: 'VMP-001', name: 'Đỗ Trần Hồ Thắng' }],
                            });
                        }

                        setDataLoaded(true);
                    }
                });

                return () => dbRef.off('value', listener);
            }, [form, currentWeekKey, selectedDate, isConfigured]);

            const saveTimeoutRef = useRef(null);

            const handleValuesChange = (_, allValues) => {
                if (isLocked || !isConfigured) return;

                if (saveTimeoutRef.current) clearTimeout(saveTimeoutRef.current);
                setLoading(true);

                saveTimeoutRef.current = setTimeout(async () => {
                    try {
                        const cleanEmployees = (allValues.employees || []).map(emp => emp || { id: '', name: '' });
                        await database.ref(`meal-registration/${currentWeekKey}`).set({
                            employees: cleanEmployees,
                            lastUpdated: new Date().toISOString()
                        });
                    } catch (error) {
                        message.error('Lỗi tự động lưu: ' + error.message);
                    } finally {
                        setLoading(false);
                    }
                }, 800);
            };

            const fetchMonthlyReport = async () => {
                if (!isConfigured) return;
                setReportLoading(true);
                setMonthlyReportData([]);

                try {
                    const startOfMonth = selectedReportMonth.startOf('month');
                    const endOfMonth = selectedReportMonth.endOf('month');
                    
                    let weekStart = startOfMonth.day() === 0 ? startOfMonth.subtract(6, 'day') : startOfMonth.day(1);
                    const weeksData = [];

                    while (weekStart.isBefore(endOfMonth) || weekStart.isSame(endOfMonth, 'day')) {
                        const weekKey = weekStart.format('YYYY-[w]ww');
                        weeksData.push({ key: weekKey, start: weekStart.clone() });
                        weekStart = weekStart.add(1, 'week');
                    }

                    const monthlySummary = {};
                    const dayKeys = ['t2', 't3', 't4', 't5', 't6', 't7', 'cn'];
                    const dayNames = ['Thứ 2', 'Thứ 3', 'Thứ 4', 'Thứ 5', 'Thứ 6', 'Thứ 7', 'Chủ Nhật'];

                    for (const weekInfo of weeksData) {
                        const snapshot = await database.ref(`meal-registration/${weekInfo.key}`).once('value');
                        const data = snapshot.val();
                        if (data && data.employees) {
                            
                            dayKeys.forEach((dKey, index) => {
                                const exactDate = weekInfo.start.add(index, 'day');
                                if (exactDate.month() === selectedReportMonth.month()) {
                                    const dateStr = exactDate.format('DD/MM/YYYY');
                                    if (!monthlySummary[dateStr]) {
                                        monthlySummary[dateStr] = { 
                                            date: dateStr, 
                                            dayName: dayNames[index],
                                            timestamp: exactDate.valueOf(),
                                            totalTrua: 0, 
                                            totalChieu: 0 
                                        };
                                    }
                                }
                            });

                            data.employees.forEach(emp => {
                                if (!emp) return;
                                
                                dayKeys.forEach((dKey, index) => {
                                    const exactDate = weekInfo.start.add(index, 'day');
                                    
                                    if (exactDate.month() === selectedReportMonth.month()) {
                                        const dateStr = exactDate.format('DD/MM/YYYY');
                                        if (emp[`${dKey}_t`]) monthlySummary[dateStr].totalTrua++;
                                        if (emp[`${dKey}_c`]) monthlySummary[dateStr].totalChieu++;
                                    }
                                });
                            });
                        }
                    }

                    const reportArray = Object.values(monthlySummary);
                    reportArray.sort((a, b) => a.timestamp - b.timestamp);

                    setMonthlyReportData(reportArray);
                } catch (error) {
                    message.error('Lỗi khi tải báo cáo tháng: ' + error.message);
                } finally {
                    setReportLoading(false);
                }
            };

            useEffect(() => {
                if (activeTab === 'report') {
                    fetchMonthlyReport();
                }
            }, [selectedReportMonth, activeTab, isConfigured]);

            const dayHeaders = ['Thứ 2', 'Thứ 3', 'Thứ 4', 'Thứ 5', 'Thứ 6', 'Thứ 7', 'CN'];
            const dayKeys = ['t2', 't3', 't4', 't5', 't6', 't7', 'cn'];

            const syncFromPreviousWeek = async () => {
                if (isLocked || !isConfigured) return;
                setLoading(true);
                const prevWeekLocalDate = selectedDate.subtract(1, 'week');
                const prevWeekKey = prevWeekLocalDate.format('YYYY-[w]ww');
                try {
                    const prevSnapshot = await database.ref(`meal-registration/${prevWeekKey}`).once('value');
                    const prevData = prevSnapshot.val();

                    if (prevData && prevData.employees) {
                        const currentEmps = form.getFieldValue('employees') || [];
                        const currentIdsInfo = currentEmps.map(e => (e ? e.id || e.name : '').toLowerCase().trim());

                        let addedCount = 0;
                        const newEmps = [...currentEmps];

                        prevData.employees.forEach(emp => {
                            if (!emp) return;
                            const identifier = (emp.id || emp.name || '').toLowerCase().trim();
                            if (identifier && !currentIdsInfo.includes(identifier)) {
                                newEmps.push({
                                    id: emp.id || '',
                                    name: emp.name || '',
                                });
                                addedCount++;
                            }
                        });

                        form.setFieldsValue({ employees: newEmps });
                        handleValuesChange(null, { employees: newEmps });

                        if (addedCount > 0) {
                            message.success(`Đã bổ sung ${addedCount} nhân sự từ Tuần ${prevWeekKey.split('-w')[1]}!`);
                        } else {
                            message.info(`Tất cả nhân sự Tuần ${prevWeekKey.split('-w')[1]} đều đã có mặt ở Tuần này.`);
                        }
                    } else {
                        message.warning('Không tìm thấy dữ liệu Tuần trước để đồng bộ.');
                    }
                } catch (error) {
                    message.error('Lỗi đồng bộ: ' + error.message);
                } finally {
                    setLoading(false);
                }
            };

            const getTotalMeals = (dayPrefix, session) => {
                if (!employeesData || !Array.isArray(employeesData)) return 0;
                return employeesData.reduce((total, emp) => {
                    const val = emp ? emp[`${dayPrefix}_${session}`] : null;
                    if (val && val.trim() !== '') return total + 1;
                    return total;
                }, 0);
            };

            const totalTrua = dayKeys.reduce((acc, d) => acc + getTotalMeals(d, 't'), 0);
            const totalChieu = dayKeys.reduce((acc, d) => acc + getTotalMeals(d, 'c'), 0);
            const totalThayThe = (employeesData || []).filter(e => e && e.replaceBy && e.replaceBy.trim() !== '').length;

            const exportToExcel = () => {
                const data = form.getFieldValue('employees') || [];
                const exportData = data.map((emp, index) => ({
                    "STT": index + 1, "Mã NV": emp.id || "", "Họ Tên": emp.name || "",
                    "T2 - Trưa": emp.t2_t || "", "T2 - Chiểu": emp.t2_c || "",
                    "T3 - Trưa": emp.t3_t || "", "T3 - Chiểu": emp.t3_c || "",
                    "T4 - Trưa": emp.t4_t || "", "T4 - Chiểu": emp.t4_c || "",
                    "T5 - Trưa": emp.t5_t || "", "T5 - Chiểu": emp.t5_c || "",
                    "T6 - Trưa": emp.t6_t || "", "T6 - Chiểu": emp.t6_c || "",
                    "T7 - Trưa": emp.t7_t || "", "T7 - Chiểu": emp.t7_c || "",
                    "CN - Trưa": emp.cn_t || "", "CN - Chiểu": emp.cn_c || "",
                    "Ghi chú - Không ăn": emp.noEat || "", "Ghi chú - Đổi món": emp.replaceBy || ""
                }));

                const worksheet = XLSX.utils.json_to_sheet(exportData);
                const wsCols = [{ wch: 5 }, { wch: 10 }, { wch: 25 }];
                for (let i = 0; i < 14; i++) wsCols.push({ wch: 12 });
                wsCols.push({ wch: 20 }, { wch: 20 });
                worksheet['!cols'] = wsCols;

                const workbook = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(workbook, worksheet, `Tuan_${currentWeekKey.split('-w')[1]}`);
                XLSX.writeFile(workbook, `BaoCaoSuatAn_${currentWeekKey}.xlsx`);
            };

            const handleDownloadImage = () => {
                const element = document.getElementById('meal-table');
                if (!element) return;

                const hideLoading = message.loading('Đang tạo ảnh chụp (vui lòng đợi một chút)...', 0);

                // Bật chế độ screenshotMode để bảng bung hết chiều cao
                const wasScreenshotMode = screenshotMode;
                if (!wasScreenshotMode) setScreenshotMode(true);

                setTimeout(() => {
                    html2canvas(element, {
                        backgroundColor: '#0b1326', // Màu nền theme
                        scale: 1.5, // Tăng chất lượng ảnh
                        useCORS: true,
                        logging: false,
                        windowWidth: element.scrollWidth,
                        width: element.scrollWidth
                    }).then(canvas => {
                        const imgData = canvas.toDataURL('image/png');
                        const link = document.createElement('a');
                        link.href = imgData;
                        link.download = `BangCom_Tuan_${currentWeekKey.split('-w')[1]}.png`;
                        document.body.appendChild(link);
                        link.click();
                        document.body.removeChild(link);

                        hideLoading();
                        message.success('Đã tải ảnh thành công!');

                        // Phục hồi trạng thái cũ
                        if (!wasScreenshotMode) setScreenshotMode(false);
                    }).catch(err => {
                        hideLoading();
                        message.error('Lỗi khi tạo ảnh: ' + err.message);
                    });
                }, 800); // Đợi DOM cập nhật đầy đủ nếu vừa mở bảng
            };

            const handleGoogleLogin = async () => {
                try {
                    const provider = new firebase.auth.GoogleAuthProvider();
                    await auth.signInWithPopup(provider);
                } catch (error) {
                    message.error('Đăng nhập thất bại (bạn đã bật Google Sign-in chưa?): ' + error.message);
                }
            };

            const handleLogout = async () => {
                await auth.signOut();
            };

            const handleUnlock = () => {
                if (!isLocked) {
                    setIsLocked(true);
                    message.info('Về lại trạng thái an toàn (Read Only).');
                } else {
                    setIsLocked(false);
                    message.success('Đã mở khóa! Sẽ Auto-Save mọi thao tác.');
                }
            };

            /* ==== COMPONENT RENDER TABS ==== */

            // Tab 2: Quản lý Team
            const renderTeamTab = () => (
                <div className="glass-card rounded-2xl p-6 shadow-2xl overflow-hidden border border-slate-700 font-['Inter'] animate-[fadeIn_0.5s_ease-out]">
                    <div className="flex justify-between items-center mb-6 gap-4 flex-wrap border-b border-slate-700/50 pb-4">
                        <h2 className="font-['Space_Grotesk'] font-bold text-xl text-primary flex items-center gap-3">
                            <span className="material-symbols-outlined">group</span> Danh Bạ Rút Gọn (Chốt Danh Sách Nhanh)
                        </h2>
                        <DatePicker
                            picker="week"
                            size="middle"
                            format={(val) => `Tuần ${val.format('ww')} (${val.day(1).format('DD/MM')} - ${val.day(7).format('DD/MM')})`}
                            allowClear={false}
                            value={selectedDate}
                            onChange={(date) => date && setSelectedDate(date)}
                            className="bg-surface-container-high border-slate-700/80 hover:border-primary/50 text-white shadow-none focus:ring-0 w-48 sm:w-56 font-semibold"
                            inputReadOnly
                        />
                    </div>

                                <p className="text-slate-400 text-sm mb-8">Bạn cần đăng nhập bằng hệ thống Email đã được phê duyệt mới có thể vào ứng dụng.</p>

                                <button onClick={handleGoogleLogin} className="w-full flex items-center justify-center gap-4 px-6 py-4 rounded-xl bg-white hover:bg-slate-100 text-slate-800 font-bold transition-all hover:scale-105 active:scale-95 shadow-[0_0_20px_rgba(255,255,255,0.2)]">
                                    <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google" className="w-6 h-6 border bg-white rounded-full p-0.5" />
                                    <span>Đăng nhập qua Google Auth</span>
                                </button>

                                <div className="mt-8 text-xs text-slate-400 max-w-xs bg-slate-900/50 p-4 rounded-xl border border-error/20 border-l-4 border-l-error text-left shadow-inner">
                                    <div className="font-bold flex items-center gap-1 mb-1 text-slate-200"><span className="material-symbols-outlined text-[14px]">warning</span> LƯU Ý ADMIN:</div>
                                    Để bật tính năng này, bạn <b>PHẢI</b> vào <a href="https://console.firebase.google.com" target="_blank" className="text-teal-400 font-bold underline">Firebase Console</a> &gt; Authentication &gt; Bật "Google Sign-in" lên nhé!
                                </div>
                            </div>
                        </div>
                    </ConfigProvider>
                );
            }

            return (
                <ConfigProvider theme={{ algorithm: theme.darkAlgorithm }}>
                    <div className="flex flex-col min-h-screen">

                        {/* --- TOP HEADER BAR --- */}
                        <header className="fixed top-0 w-full flex justify-between items-center px-4 md:px-8 h-16 bg-slate-950/70 backdrop-blur-xl z-[60] border-b border-slate-800/50 shadow-2xl">
                            <div className="flex items-center gap-4 lg:gap-8">
                                <span className="text-xl font-bold text-teal-500 tracking-tighter font-['Space_Grotesk'] hidden sm:block">VitalMeal Pro</span>
                                <nav className="flex gap-3 sm:gap-6 overflow-x-auto no-scrollbar max-w-[60vw]">
                                    <span onClick={() => setActiveTab('meal-board')} className={`flex items-center gap-1 font-['Space_Grotesk'] text-[11px] sm:text-sm tracking-tight cursor-pointer transition-all whitespace-nowrap ${activeTab === 'meal-board' ? 'text-teal-400 border-b-2 border-teal-500 pb-1' : 'text-slate-400 hover:text-slate-200'}`}><span className="material-symbols-outlined text-[14px] sm:text-[18px]">restaurant</span> Bảng Cơm</span>
                                    <span onClick={() => setActiveTab('team')} className={`flex items-center gap-1 font-['Space_Grotesk'] text-[11px] sm:text-sm tracking-tight cursor-pointer transition-all whitespace-nowrap ${activeTab === 'team' ? 'text-teal-400 border-b-2 border-teal-500 pb-1' : 'text-slate-400 hover:text-slate-200'}`}><span className="material-symbols-outlined text-[14px] sm:text-[18px]">group</span> Quản lý Team</span>
                                    <span onClick={() => setActiveTab('report')} className={`flex items-center gap-1 font-['Space_Grotesk'] text-[11px] sm:text-sm tracking-tight cursor-pointer transition-all whitespace-nowrap ${activeTab === 'report' ? 'text-teal-400 border-b-2 border-teal-500 pb-1' : 'text-slate-400 hover:text-slate-200'}`}><span className="material-symbols-outlined text-[14px] sm:text-[18px]">monitoring</span> Báo cáo</span>
                                </nav>
                            </div>
                            <div className="flex items-center gap-2 sm:gap-4">
                                <div className="hidden lg:flex items-center gap-2 bg-slate-900 border border-slate-700/50 pl-2 pr-3 py-1 rounded-full">
                                    <img src={userAuth?.photoURL || "https://ui-avatars.com/api/?name=User"} className="w-7 h-7 rounded-full border border-slate-700" alt="Avatar" />
                                    <span className="text-xs font-bold text-slate-300 max-w-[150px] truncate">{userAuth?.email}</span>
                                </div>
                                <button onClick={handleLogout} className="px-2 sm:px-3 py-1.5 rounded-lg bg-surface-container hover:bg-error/20 text-outline hover:text-error transition-all flex items-center gap-2 shadow-md hover:border-error/50 border border-transparent active:scale-95">
                                    <span className="material-symbols-outlined text-[16px] sm:text-[18px]">logout</span>
                                    <span className="hidden sm:inline font-bold text-xs">Thoát</span>
                                </button>
                                <button onClick={handleUnlock} className={`px-2 sm:px-4 py-1.5 rounded-lg font-[Inter] font-bold text-xs md:text-sm shadow-md active:scale-95 transition-all flex items-center gap-2 border ${isLocked ? 'bg-surface-container text-outline border-transparent hover:bg-slate-800' : 'bg-primary-container text-on-primary-container border-teal-400 shadow-[0_0_15px_rgba(20,184,166,0.4)]'}`}>
                                    <span className="material-symbols-outlined text-[16px] sm:text-[18px]">{isLocked ? 'lock' : 'lock_open'}</span>
                                    <span className="hidden sm:inline">{isLocked ? 'Unlock' : 'Live Save'}</span>
                                </button>
                            </div>
                        </header>

                        {/* --- MAIN PAGE YIELD DYNAMIC TABS --- */}
                        <main className="flex-1 pt-20 px-2 lg:px-8 pb-8 flex flex-col gap-6">

                            {/* (Title Block Removed as per layout update to save space) */}

                            {/* HOÀN LẶP (RENDER ROUTER) */}
                            {activeTab === 'meal-board' && renderMealBoard()}
                            {activeTab === 'team' && renderTeamTab()}
                            {activeTab === 'report' && renderReportTab()}

                        </main>

                        <style>{`
                            @keyframes fadeIn {
                                from { opacity: 0; transform: translateY(10px); }
                                to { opacity: 1; transform: translateY(0); }
                            }
                        `}</style>
                    </div>
                </ConfigProvider>
            );
        };
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>
