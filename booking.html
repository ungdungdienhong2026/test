<!DOCTYPE html>
<html class="dark" lang="vi">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Xác nhận đặt phòng - Premium Booking</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Hanken+Grotesk:wght@500;600;700&family=Geist:wght@400;600&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "tertiary-fixed-dim": "#d0bcff",
                        "on-surface-variant": "#c7c4d7",
                        "secondary-fixed": "#c9e6ff",
                        "on-secondary-fixed": "#001e2f",
                        "on-tertiary-fixed-variant": "#5516be",
                        "on-tertiary": "#3c0091",
                        "on-primary": "#1000a9",
                        "primary": "#c0c1ff",
                        "surface-variant": "#2d3449",
                        "surface-container-low": "#131b2e",
                        "on-surface": "#dae2fd",
                        "primary-fixed": "#e1e0ff",
                        "surface-container": "#171f33",
                        "outline-variant": "#464554",
                        "inverse-primary": "#494bd6",
                        "surface-container-high": "#222a3d",
                        "tertiary": "#d0bcff",
                        "surface": "#0b1326",
                        "inverse-surface": "#dae2fd",
                        "outline": "#908fa0",
                        "secondary-container": "#00a2e6",
                        "primary-container": "#8083ff",
                        "on-primary-fixed-variant": "#2f2ebe",
                        "secondary-fixed-dim": "#89ceff",
                        "on-primary-fixed": "#07006c",
                        "surface-container-highest": "#2d3449",
                        "on-error-container": "#ffdad6",
                        "surface-bright": "#31394d",
                        "background": "#0b1326",
                        "inverse-on-surface": "#283044",
                        "error-container": "#93000a",
                        "on-secondary": "#00344d",
                        "tertiary-container": "#a078ff",
                        "error": "#ffb4ab",
                        "secondary": "#89ceff",
                        "on-tertiary-container": "#340080",
                        "tertiary-fixed": "#e9ddff",
                        "on-tertiary-fixed": "#23005c",
                        "surface-tint": "#c0c1ff",
                        "primary-fixed-dim": "#c0c1ff",
                        "surface-container-lowest": "#060e20",
                        "on-error": "#690005",
                        "on-secondary-container": "#00344e",
                        "on-primary-container": "#0d0096",
                        "surface-dim": "#0b1326",
                        "on-secondary-fixed-variant": "#004c6e",
                        "on-background": "#dae2fd"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "gutter": "24px",
                        "base": "8px",
                        "container-max-width": "1280px",
                        "margin-mobile": "20px",
                        "margin-desktop": "64px"
                    },
                    "fontFamily": {
                        "mono-data": ["Geist"],
                        "headline-lg-mobile": ["Hanken Grotesk"],
                        "title-md": ["Hanken Grotesk"],
                        "body-sm": ["Inter"],
                        "label-caps": ["Geist"],
                        "display-lg": ["Hanken Grotesk"],
                        "headline-lg": ["Hanken Grotesk"],
                        "body-md": ["Inter"]
                    },
                    "fontSize": {
                        "mono-data": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                        "headline-lg-mobile": ["24px", {"lineHeight": "32px", "fontWeight": "600"}],
                        "title-md": ["20px", {"lineHeight": "28px", "fontWeight": "500"}],
                        "body-sm": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                        "label-caps": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600"}],
                        "display-lg": ["48px", {"lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                        "headline-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "600"}],
                        "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}]
                    }
                },
            },
        }
    </script>
    <style>
        .glass-card {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
        }
        
        .glass-card:hover {
            border-color: rgba(192, 193, 255, 0.3);
            background: rgba(15, 23, 42, 0.7);
        }
        
        /* Focus state for inputs */
        input:focus, select:focus, textarea:focus {
            box-shadow: 0px 0px 20px rgba(99, 102, 241, 0.25) !important;
            border-color: #c0c1ff !important;
            outline: none !important;
            background: rgba(15, 23, 42, 0.8) !important;
        }

        .transition-soft {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
    </style>
</head>
<body class="bg-background text-on-background font-body-md min-h-screen">
    <!-- Top App Bar -->
    <header class="bg-surface/60 backdrop-blur-xl border-b border-white/10 docked full-width top-0 sticky flex justify-between items-center px-margin-mobile h-16 w-full z-50">
        <div class="flex items-center gap-4">
            <button id="back-btn" class="text-primary hover:bg-white/5 p-2 rounded-full transition-colors active:scale-95 duration-200">
                <span class="material-symbols-outlined">arrow_back</span>
            </button>
            <h1 class="text-on-surface font-headline-lg-mobile text-headline-lg-mobile font-bold">Chi tiết đặt phòng</h1>
        </div>
        <div class="flex items-center gap-2">
            <div class="w-8 h-8 rounded-full bg-primary-container flex items-center justify-center text-on-primary-container font-bold text-xs">
                JD
            </div>
        </div>
    </header>

    <main class="max-w-container-max-width mx-auto px-margin-mobile md:px-margin-desktop py-8">
        <div class="flex flex-col lg:flex-row gap-8">
            <!-- Left Column: Summary -->
            <div class="lg:w-1/3 flex flex-col gap-6">
                <div>
                    <h2 class="font-headline-lg text-headline-lg text-primary tracking-tight">Xác nhận</h2>
                    <p class="text-on-surface-variant font-body-sm mt-1">Kiểm tra lại thông tin thời gian</p>
                </div>
                
                <div class="glass-card rounded-2xl p-6">
                    <div class="flex items-center gap-3 mb-6 pb-4 border-b border-white/10">
                        <span class="material-symbols-outlined text-primary text-3xl">calendar_today</span>
                        <div>
                            <p class="font-label-caps text-label-caps text-on-surface-variant">NGÀY ĐẶT</p>
                            <p class="font-title-md text-title-md text-on-surface" id="selected-date">--/--/----</p>
                        </div>
                    </div>
                    
                    <p class="font-label-caps text-label-caps text-on-surface-variant mb-4">KHUNG GIỜ ĐÃ CHỌN</p>
                    <div id="selected-slots" class="flex flex-col gap-3">
                        <!-- Slots injected by JS -->
                    </div>
                </div>
            </div>

            <!-- Right Column: Form -->
            <div class="lg:w-2/3">
                <form id="booking-form" class="glass-card rounded-2xl p-6 md:p-8 flex flex-col gap-6">
                    <h3 class="font-title-md text-title-md text-on-surface">Thông tin người đặt</h3>
                    
                    <div class="flex flex-col gap-2">
                        <label for="name" class="font-label-caps text-label-caps text-on-surface-variant">HỌ VÀ TÊN <span class="text-error">*</span></label>
                        <input type="text" id="name" required placeholder="Nhập họ và tên đầy đủ" 
                            class="w-full bg-surface-container-high border border-white/10 rounded-xl px-4 py-3 text-on-surface font-body-md placeholder:text-on-surface-variant/50 transition-soft">
                    </div>

                    <div class="flex flex-col gap-2">
                        <label for="department" class="font-label-caps text-label-caps text-on-surface-variant">PHÒNG BAN</label>
                        <select id="department" class="w-full bg-surface-container-high border border-white/10 rounded-xl px-4 py-3 text-on-surface font-body-md transition-soft appearance-none cursor-pointer">
                            <option value="IT">IT</option>
                            <option value="Marketing">Marketing</option>
                            <option value="Kế toán">Kế toán</option>
                            <option value="ISO">ISO</option>
                            <option value="Công tác xã hội">Công tác xã hội</option>
                            <option value="Nhân sự">Nhân sự</option>
                        </select>
                    </div>

                    <div class="flex flex-col gap-2">
                        <label for="purpose" class="font-label-caps text-label-caps text-on-surface-variant">MỤC ĐÍCH CUỘC HỌP <span class="text-error">*</span></label>
                        <textarea id="purpose" required rows="3" placeholder="Ví dụ: Họp team tuần, Gặp gỡ đối tác..." 
                            class="w-full bg-surface-container-high border border-white/10 rounded-xl px-4 py-3 text-on-surface font-body-md placeholder:text-on-surface-variant/50 transition-soft resize-none"></textarea>
                    </div>

                    <button type="submit" class="mt-4 bg-primary hover:bg-primary-container text-on-primary font-label-caps text-label-caps px-8 py-4 rounded-xl shadow-[0_8px_16px_rgba(192,193,255,0.2)] hover:shadow-[0_8px_20px_rgba(192,193,255,0.4)] transition-all duration-300 active:scale-95 flex items-center justify-center gap-2 w-full">
                        XÁC NHẬN ĐẶT PHÒNG
                        <span class="material-symbols-outlined text-sm">check_circle</span>
                    </button>
                </form>
            </div>
        </div>
    </main>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="booking.js"></script>
</body>
</html>
