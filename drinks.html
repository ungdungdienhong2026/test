<body class="bg-background text-on-background min-h-screen pb-24">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;
        const { Modal, Form, Input, InputNumber, message, Button } = antd;

        const App = () => {
            const [orders, setOrders] = useState([]);
            const [currentDate, setCurrentDate] = useState(dayjs().format('YYYY-MM-DD'));
            const [isModalOpen, setIsModalOpen] = useState(false);
            const [editingOrderId, setEditingOrderId] = useState(null);
            const [screenshotMode, setScreenshotMode] = useState(false);
            const [form] = Form.useForm();

            useEffect(() => {
                
                const unsubscribe = db.collection('drink_orders').doc(currentDate).collection('orders')
                    .orderBy('timestamp', 'asc')
                    .onSnapshot((snapshot) => {
                        const ordersList = snapshot.docs.map(doc => ({
                            id: doc.id,
                            ...doc.data()
                        }));
                        setOrders(ordersList);
                    }, (error) => {
                        message.error('Lỗi tải dữ liệu: ' + error.message);
                    });
                return () => unsubscribe();
            }, [currentDate]);



            const togglePaymentStatus = async (orderId, currentStatus) => {
                try {
                    await db.collection('drink_orders').doc(currentDate).collection('orders').doc(orderId).update({
                        isPaid: !currentStatus
                    });
                } catch (error) {
                    message.error('Lỗi cập nhật: ' + error.message);
                }
            };

            const handleEdit = (order) => {
                setEditingOrderId(order.id);
                form.setFieldsValue({
                    name: order.name,
                    drink: order.drink,
                    note: order.note,
                    price: order.price,
                });
                setIsModalOpen(true);
            };

            const showDeleteConfirm = (orderId) => {
                Modal.confirm({
                    title: 'Xóa món này?',
                    content: 'Bạn có chắc chắn muốn xóa món này không? Hành động này không thể hoàn tác.',
                    okText: 'Xóa',
                    okType: 'danger',
                    cancelText: 'Hủy',
                    className: 'dark-modal',
                    onOk: async () => {
                        try {
                            await db.collection('drink_orders').doc(currentDate).collection('orders').doc(orderId).delete();
                            message.success('Đã xóa món!');
                        } catch (error) {
                            message.error('Lỗi xóa dữ liệu: ' + error.message);
                        }
                    }
                });
            };

            const handleAddOrder = async (values) => {
                try {
                    if (editingOrderId) {
                        await db.collection('drink_orders').doc(currentDate).collection('orders').doc(editingOrderId).update({
                            name: values.name,
                            drink: values.drink,
                            note: values.note || '',
                            price: values.price,
                            addedBy: values.name,
                        });
                        message.success('Đã cập nhật món!');
                    } else {
                        await db.collection('drink_orders').doc(currentDate).collection('orders').add({
                            name: values.name,
                            drink: values.drink,
                            note: values.note || '',
                            price: values.price,
                            isPaid: false,
                            addedBy: values.name,
                            timestamp: firebase.firestore.FieldValue.serverTimestamp()
                        });
                        message.success('Đã thêm đồ uống!');
                    }
                    setIsModalOpen(false);
                    form.resetFields();
                    setEditingOrderId(null);
                } catch (error) {
                    message.error('Lỗi lưu dữ liệu: ' + error.message);
                }
            };

            const handleDownloadImage = async () => {
                const element = document.getElementById('report-capture-area');
                if (!element) return;
                try {
                    const canvas = await html2canvas(element, { scale: 2, backgroundColor: '#0b1326' });
                    const link = document.createElement('a');
                    link.download = `DoUong_${currentDate}.png`;
                    link.href = canvas.toDataURL('image/png');
                    link.click();
                    message.success('Đã tải ảnh thành công!');
                } catch (error) {
                    message.error('Lỗi khi tạo ảnh: ' + error.message);
                }
            };

            const exportToExcel = () => {
                if (!orders || orders.length === 0) {
                    message.warning('Không có dữ liệu để xuất!');
                    return;
                }

                const exportData = orders.map((order, idx) => ({
                    'STT': idx + 1,
                    'Người đặt': order.name,
                    'Đồ uống': order.drink,
                    'Ghi chú': order.note || '',
                    'Giá': order.price,
                    'Đã thanh toán': order.isPaid ? 'Đã Thanh Toán' : 'Chưa Thanh Toán'
                }));

                const worksheet = XLSX.utils.json_to_sheet(exportData);
                const workbook = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(workbook, worksheet, "DoUong");

                XLSX.writeFile(workbook, `ThongKeDoUong_${currentDate}.xlsx`);
            };

            const totalOrders = orders.length;
            const totalPrice = orders.reduce((sum, order) => sum + (Number(order.price) || 0), 0);

            const groupedDrinks = useMemo(() => {
                const group = {};
                orders.forEach(order => {
                    if (!order.drink) return;
                    const name = order.drink.trim();
                    const key = name.toLowerCase();
                    if (!group[key]) {
                        group[key] = { name: name, count: 1 };
                    } else {
                        group[key].count += 1;
                    }
                });
                return Object.values(group).sort((a, b) => b.count - a.count);
            }, [orders]);

            // Format tiền
            const formatMoney = (amount) => {
                if (!amount) return '0k';
                return (amount / 1000) + 'k';
            };

            return (
                <div className={`w-full ${screenshotMode ? 'screenshot-mode-active' : ''}`} id="report-capture-area">
                    <header className="sticky top-0 z-40 glass-header flex flex-col md:flex-row justify-between items-start md:items-center px-margin-mobile w-full py-4 border-b border-outline-variant/20 gap-4">
                        <div className="flex items-center gap-4">
                            <h1 className="font-headline-lg-mobile text-headline-lg-mobile font-bold text-primary">
                                ĐẶT ĐỒ UỐNG
                            </h1>
                            <input 
                                type="date" 
                                value={currentDate}
                                onChange={(e) => setCurrentDate(e.target.value)}
                                className="bg-surface-container-high border border-outline-variant/30 text-on-surface font-label-caps rounded-lg px-2 py-1 outline-none focus:border-primary"
                            />
                        </div>
                        <div className="flex items-center gap-2" data-html2canvas-ignore>
                            <button type="button" onClick={() => setScreenshotMode(!screenshotMode)} className={`flex items-center justify-center gap-2 px-4 py-2 rounded-lg ${screenshotMode ? 'bg-error text-slate-900 border-transparent shadow-[0_0_15px_rgba(255,180,171,0.4)]' : 'bg-surface-bright/50 hover:bg-surface-container-highest text-slate-200 border-outline-variant/30'} font-bold shadow-sm transition-all active:scale-95 text-[13px] whitespace-nowrap border`}>
                                <span className="material-symbols-outlined text-[16px]">{screenshotMode ? 'fullscreen_exit' : 'fullscreen'}</span>
                            </button>
                            <button type="button" onClick={handleDownloadImage} className="flex items-center justify-center gap-2 px-4 py-2 rounded-lg bg-blue-500 hover:bg-blue-400 text-slate-900 font-bold shadow-[0_0_15px_rgba(59,130,246,0.2)] transition-all active:scale-95 text-[13px] whitespace-nowrap border border-transparent">
                                <span className="material-symbols-outlined text-[16px]">image</span>
                            </button>
                            <button type="button" onClick={exportToExcel} className="flex items-center justify-center gap-2 px-4 py-2 rounded-lg bg-[#57f1db] hover:bg-[#3cddc7] text-[#003731] font-bold shadow-[0_0_15px_rgba(87,241,219,0.2)] transition-all active:scale-95 text-[13px] whitespace-nowrap border border-transparent">
                                <span className="material-symbols-outlined text-[16px]">ios_share</span>
                            </button>
                        </div>
                    </header>

                    <main className="px-margin-mobile space-y-stack-lg pt-4 pb-24 max-w-[1280px] mx-auto">
                        <div className="flex items-center justify-between">
                            <span className="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-widest">
                                {dayjs(currentDate).format('DD/MM/YYYY')}
                            </span>
                        </div>

                        <section className="grid grid-cols-2 gap-stack-md">
                            <div className="bg-surface-container-low p-stack-lg rounded-xl shadow-sm border border-outline-variant/30 flex flex-col max-h-[160px]">
                                <div className="flex items-center gap-2 mb-3">
                                    <span className="material-symbols-outlined text-primary scale-90">shopping_cart</span>
                                    <span className="font-label-caps text-label-caps text-on-surface-variant">TỔNG ĐƠN ({totalOrders})</span>
                                </div>
                                {groupedDrinks.length > 0 ? (
                                    <ul className="space-y-2 flex-1 overflow-y-auto pr-2 custom-scrollbar">
                                        {groupedDrinks.map((item, idx) => (
                                            <li key={idx} className="flex justify-between items-center text-sm border-b border-outline-variant/10 pb-1 last:border-0 last:pb-0">
                                                <span className="text-on-surface line-clamp-1 flex-1 pr-2" title={item.name}>{item.name}</span>
                                                <span className="text-primary font-bold bg-primary/10 px-2 py-0.5 rounded text-xs whitespace-nowrap">x{item.count}</span>
                                            </li>
                                        ))}
                                    </ul>
                                ) : (
                                    <div className="flex flex-col">
                                        <div className="font-headline-lg text-headline-lg text-primary">{totalOrders}</div>
                                        <div className="font-body-sm text-body-sm text-on-surface-variant mt-1">Sản phẩm đặt</div>
                                    </div>
                                )}
                            </div>
                            <div className="bg-surface-container-high p-stack-lg rounded-xl shadow-md border border-outline-variant/30 relative overflow-hidden">
                                <div className="absolute -right-4 -top-4 w-24 h-24 bg-primary/10 rounded-full blur-xl"></div>
                                <div className="flex items-center gap-2 mb-2 relative z-10">
                                    <span className="material-symbols-outlined text-primary scale-90">payments</span>
                                    <span className="font-label-caps text-label-caps text-on-surface">TỔNG TIỀN</span>
                                </div>
                                <div className="font-headline-lg text-headline-lg text-on-surface relative z-10">{formatMoney(totalPrice)}</div>
                                <div className="font-body-sm text-body-sm text-on-surface-variant mt-1 relative z-10">VNĐ Dự tính</div>
                            </div>
                        </section>

                        <section className="space-y-stack-md">
                            <h2 className="font-title-md text-title-md text-primary px-1">Danh sách chi tiết</h2>
                            <div className="overflow-x-auto pb-2 -mx-margin-mobile px-margin-mobile md:mx-0 md:px-0">
                                <div className="min-w-[640px] bg-surface-container-lowest rounded-xl shadow-sm border border-outline-variant/20 overflow-hidden">
                                    <table className="w-full text-left border-collapse">
                                        <thead>
                                            <tr className="bg-surface-container-low border-b border-outline-variant/30">
                                                <th className="p-3 font-label-caps text-label-caps text-on-surface-variant font-semibold w-12 text-center">STT</th>
                                                <th className="p-3 font-label-caps text-label-caps text-on-surface-variant font-semibold w-40">Người đặt</th>
                                                <th className="p-3 font-label-caps text-label-caps text-on-surface-variant font-semibold">Đồ uống (Kèm ghi chú)</th>
                                                <th className="p-3 font-label-caps text-label-caps text-on-surface-variant font-semibold w-24">Giá</th>
                                                <th className="p-3 font-label-caps text-label-caps text-on-surface-variant font-semibold w-32 text-center">Trạng thái</th>
                                                <th className="p-3 font-label-caps text-label-caps text-on-surface-variant font-semibold w-24 text-center">Thao tác</th>
                                            </tr>
                                        </thead>
                                        <tbody className="divide-y divide-outline-variant/20">
                                            {orders.length === 0 ? (
                                                <tr>
                                                    <td colSpan="6" className="p-6 text-center text-on-surface-variant font-body-sm">
                                                        Chưa có ai đặt đồ uống ngày này. Bấm dấu + để tạo đơn mới!
                                                    </td>
                                                </tr>
                                            ) : (
                                                orders.map((order, idx) => (
                                                    <tr key={order.id} className="hover:bg-surface-variant/20 transition-colors order-row">
                                                        <td className="p-3 text-center text-on-surface-variant font-label-caps">{idx + 1}</td>
                                                        <td className="p-3">
                                                            <div className="flex items-center gap-3">
                                                                <span className="font-title-md text-[14px] leading-[20px] text-on-surface whitespace-nowrap">{order.name}</span>
                                                            </div>
                                                        </td>
                                                        <td className="p-3 flex flex-col">
                                                            <span className="font-body-sm text-body-sm text-on-surface">{order.drink}</span>
                                                            {order.note && <span className="text-[12px] text-primary/80 mt-1 italic">*{order.note}</span>}
                                                        </td>
                                                        <td className="p-3">
                                                            <span className="font-title-md text-[14px] leading-[20px] text-primary whitespace-nowrap">{formatMoney(order.price)}</span>
                                                        </td>
                                                        <td className="p-3 text-center">
                                                            <button 
                                                                onClick={() => togglePaymentStatus(order.id, order.isPaid)}
                                                                className={`inline-flex items-center px-2 py-0.5 rounded-full text-[10px] font-bold uppercase tracking-tighter whitespace-nowrap transition-transform active:scale-95 ${
                                                                    order.isPaid 
                                                                        ? "bg-[#003731] text-[#62fae3] border border-[#005047]" 
                                                                        : "bg-[#744000] text-[#ffdcc0] border border-[#965a00]"
                                                                }`}
                                                            >
                                                                {order.isPaid ? 'Đã thanh toán' : 'Chưa thanh toán'}
                                                            </button>
                                                        </td>
                                                        <td className="p-3 text-center">
                                                            <div className="flex items-center justify-center gap-2">
                                                                <button onClick={() => handleEdit(order)} className="text-on-surface-variant hover:text-primary transition-colors p-1" title="Sửa">
                                                                    <span className="material-symbols-outlined text-[18px]">edit</span>
                                                                </button>
                                                                <button onClick={() => showDeleteConfirm(order.id)} className="text-on-surface-variant hover:text-error transition-colors p-1" title="Xóa">
                                                                    <span className="material-symbols-outlined text-[18px]">delete</span>
                                                                </button>
                                                            </div>
                                                        </td>
                                                    </tr>
                                                ))
                                            )}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </section>

                        <div className="mt-8 bg-surface-container-low rounded-2xl p-6 border border-dashed border-outline-variant flex flex-col items-center text-center">
                            <span className="material-symbols-outlined text-primary text-4xl mb-2">celebration</span>
                            <p className="font-title-md text-title-md text-on-surface">Danh sách chốt theo thời gian thực!</p>
                            <p className="font-body-sm text-body-sm text-on-surface-variant">Vui lòng kiểm tra kỹ số tiền trước khi thanh toán cho cửa hàng.</p>
                        </div>
                    </main>

                    {/* Floating Action Button */}
                    <button 
                        onClick={() => {
                            setEditingOrderId(null);
                            form.resetFields();
                            setIsModalOpen(true);
                        }}
                        className="fixed bottom-8 right-6 w-14 h-14 bg-primary text-on-primary rounded-full shadow-[0_0_15px_rgba(87,241,219,0.4)] flex items-center justify-center active:scale-90 hover:scale-105 transition-transform z-50"
                    >
                        <span className="material-symbols-outlined text-2xl font-bold">add</span>
                    </button>

                    {/* Add/Edit Order Modal */}
                    <Modal
                        title={editingOrderId ? "Chỉnh sửa Đồ Uống" : "Thêm Đồ Uống Mới"}
                        open={isModalOpen}
                        onCancel={() => {
                            setIsModalOpen(false);
                            setEditingOrderId(null);
                            form.resetFields();
                        }}
                        footer={null}
                        centered
                        className="dark-modal"
                    >
                        <Form
                            form={form}
                            layout="vertical"
                            onFinish={handleAddOrder}
                            className="mt-4"
                        >
                            <Form.Item
                                name="name"
                                label="Họ và tên người nhận"
                                rules={[{ required: true, message: 'Vui lòng nhập tên!' }]}
                            >
                                <Input size="large" placeholder="Ví dụ: Nguyễn Văn A" />
                            </Form.Item>

                            <Form.Item
                                name="drink"
                                label="Món đồ uống"
                                rules={[{ required: true, message: 'Vui lòng nhập tên món!' }]}
                            >
                                <Input size="large" placeholder="Ví dụ: Trà sữa trân châu" />
                            </Form.Item>

                            <Form.Item
                                name="price"
                                label="Giá tiền (VNĐ)"
                                rules={[{ required: true, message: 'Vui lòng nhập giá tiền!' }]}
                            >
                                <InputNumber 
                                    size="large" 
                                    className="w-full" 
                                    placeholder="Ví dụ: 55000"
                                    formatter={value => `${value}`.replace(/\B(?=(\d{3})+(?!\d))/g, ',')}
                                    parser={value => value.replace(/\$\s?|(,*)/g, '')}
                                />
                            </Form.Item>

                            <Form.Item
                                name="note"
                                label="Ghi chú thêm (Không bắt buộc)"
                            >
                                <Input size="large" placeholder="Ví dụ: 50% đường, ít đá..." />
                            </Form.Item>

                            <Form.Item className="mb-0 mt-6">
                                <Button 
                                    type="primary" 
                                    htmlType="submit" 
                                    size="large" 
                                    className="w-full bg-[#57f1db] text-[#003731] hover:bg-[#3cddc7] border-none font-bold shadow-md"
                                >
                                    {editingOrderId ? "Cập nhật Đơn" : "Xác nhận Đặt"}
                                </Button>
                            </Form.Item>
                        </Form>
                    </Modal>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
