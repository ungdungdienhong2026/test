<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
    <title>Đặt đồ uống - VPT Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0..1,0&display=block">
    <link rel="stylesheet" href="assets/vpt.css?v=2">
    <script src="assets/vpt.js"></script>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        /* Vùng chụp ảnh gửi quán */
        .capture{padding:4px}
        .capture-title{display:none;text-align:center;padding:14px 0 10px}
        .capture-title h3{font-size:20px;color:var(--teal)}
        .capture-title p{color:var(--muted)}
        .capture.shot .capture-title{display:block}
    </style>
</head>
<body>
    <header class="topbar">
        <div class="crumbs"><span class="cur">Đặt đồ uống</span></div>
        <div class="top-actions">
            <button class="btn ghost" id="dr-xlsx"><span class="ms">download</span><span>Xuất Excel</span></button>
        </div>
    </header>

    <div class="content">
        <section id="view-drinks">
            <div class="app-head">
                <div><p class="eyebrow">Đồ uống</p><h2 class="h2">Đặt đồ uống</h2></div>
                <div class="tools-l">
                    <button class="icon-btn" id="dr-prev" aria-label="Ngày trước"><span class="ms">chevron_left</span></button>
                    <label class="wk-label" for="dr-date" style="position:relative;cursor:pointer"><span class="ms">event</span><span id="dr-text"></span><input type="date" id="dr-date" style="position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer" aria-label="Chọn ngày"></label>
                    <button class="icon-btn" id="dr-next" aria-label="Ngày sau"><span class="ms">chevron_right</span></button>
                    <button class="btn ghost" id="dr-today">Hôm nay</button>
                    <button class="btn primary" id="dr-add"><span class="ms">add</span>Đặt món</button>
                </div>
            </div>
            <div class="stats" id="dr-stats"></div>
            <div class="dr-grid">
                <div>
                    <div class="filters">
                        <div class="seg" id="dr-filter"><button data-f="all" class="on">Tất cả</button><button data-f="unpaid">Chưa thanh toán</button><button data-f="paid">Đã thanh toán</button></div>
                        <input class="input" id="dr-q" placeholder="Tìm người đặt hoặc món…" aria-label="Tìm kiếm" style="flex:1;min-width:180px">
                    </div>
                    <div class="table-wrap dr-twrap"><table class="dr-table"><thead><tr><th style="width:44px;text-align:center">#</th><th style="width:170px">Người đặt</th><th>Đồ uống</th><th style="width:90px">Giá</th><th style="width:150px">Thanh toán</th><th style="width:90px;text-align:center"></th></tr></thead><tbody id="dr-body"><tr><td colspan="6"><div class="loading"><span class="ms">progress_activity</span>Đang tải đơn…</div></td></tr></tbody></table></div>
                    <div class="dr-cards" id="dr-cards"></div>
                </div>
                <aside class="panel ticket">
                    <div class="capture" id="report-capture-area">
                        <div class="capture-title"><h3>Đơn đồ uống VPT</h3><p id="capture-date"></p></div>
                        <div class="side-h"><h3>Phiếu gửi quán</h3><small id="tk-count"></small></div>
                        <ul id="tk-list"></ul>
                    </div>
                    <div class="ticket-foot"><button class="btn soft" id="tk-copy"><span class="ms">content_copy</span>Sao chép</button><button class="btn ghost" id="tk-img"><span class="ms">photo_camera</span>Tải ảnh</button></div>
                    <textarea class="input" id="tk-text" hidden readonly aria-label="Nội dung phiếu"></textarea>
                </aside>
            </div>
        </section>
    </div>

    <!-- Thêm / sửa đơn -->
    <div class="modal" id="dr-modal" hidden>
        <div class="scrim" data-dclose></div>
        <form class="dialog wide dr-form" id="dr-form" role="dialog" aria-modal="true" aria-labelledby="dr-title" novalidate>
            <div class="md-head"><h3 id="dr-title" style="font-size:20px">Thêm đồ uống</h3><button type="button" class="icon-btn" data-dclose aria-label="Đóng"><span class="ms">close</span></button></div>
            <div class="field"><label class="lbl" for="dr-name">Người đặt *</label><input class="input" id="dr-name" autocomplete="name" placeholder="Ví dụ: Nguyễn Văn A"><p class="err" id="dr-name-err" hidden>Nhập tên người đặt.</p></div>
            <div class="field"><label class="lbl" for="dr-drink">Món *</label><input class="input" id="dr-drink" placeholder="Ví dụ: Trà sữa trân châu"><div class="quick" id="dr-recent"></div><p class="err" id="dr-drink-err" hidden>Nhập tên món.</p></div>
            <div class="field"><label class="lbl" for="dr-price">Giá (VNĐ) *</label><div class="dr-price-row"><input class="input mono" id="dr-price" inputmode="numeric" placeholder="Ví dụ: 35000"><span class="mono" id="dr-price-echo"></span></div><p class="err" id="dr-price-err" hidden>Nhập giá tiền là số.</p></div>
            <div class="field"><label class="lbl" for="dr-note">Ghi chú</label><input class="input" id="dr-note" placeholder="Ví dụ: 50% đường, ít đá…"><div class="quick" id="dr-notes"></div></div>
            <p class="err" id="dr-form-err" hidden></p>
            <div class="md-actions"><button type="button" class="btn ghost" data-dclose>Hủy</button><button type="submit" class="btn primary" id="dr-submit">Xác nhận đặt</button></div>
        </form>
    </div>

    <div class="toast" id="toast" hidden><span class="ms fill">check_circle</span><span id="toast-tx"></span></div>

<script>
/* ==== Đồ uống — Firestore (firebase-config.js)
   drink_orders/<YYYY-MM-DD>/orders/<id> = { name, drink, note, price, isPaid, addedBy, timestamp } ==== */
const { $, pad, ds, parseDs, addDays, esc, fm, todayStr, DL, store, toast, money, moneyFull } = VPT;
const NOTE_CHIPS = ['Ít đá', '50% đường', 'Không đường', 'Nóng', 'Size L'];
const D = { date: todayStr(), filter: 'all', q: '', edit: null, del: null, orders: [], loaded: false, recent: [] };
let unsub = null;

const col = date => db.collection('drink_orders').doc(date).collection('orders');
function subscribe() {
    if (unsub) unsub(); D.loaded = false; D.orders = []; D.del = null; render();
    unsub = col(D.date).orderBy('timestamp', 'asc').onSnapshot(qs => {
        D.orders = qs.docs.map(doc => { const o = doc.data(); return { id: doc.id, ...o, ts: o.timestamp && o.timestamp.toDate ? o.timestamp.toDate() : null }; });
        D.loaded = true; render();
    }, err => { D.loaded = true; toast('Lỗi tải dữ liệu: ' + err.message, 'bad'); render(); });
}
// Món hay gọi gần đây: gộp từ 7 ngày gần nhất (đọc 1 lần, dùng để gợi ý trong form)
async function loadRecent() {
    const g = {}; const days = []; for (let i = 0; i < 7; i++) days.push(ds(addDays(new Date(), -i)));
    try {
        const snaps = await Promise.all(days.map(d => col(d).get()));
        snaps.forEach(qs => qs.forEach(doc => { const o = doc.data(); if (!o.drink) return; const k = o.drink.trim().toLowerCase(); g[k] = g[k] || { name: o.drink.trim(), n: 0, price: o.price }; g[k].n++; if (o.price) g[k].price = o.price; }));
        D.recent = Object.values(g).sort((a, b) => b.n - a.n).slice(0, 6);
    } catch (e) { D.recent = []; }
}

function group(list) { const g = {}; list.forEach(o => { if (!o.drink) return; const name = o.drink.trim(), note = (o.note || '').trim(), k = (name + '|' + note).toLowerCase(); g[k] = g[k] || { name, note, count: 0 }; g[k].count++; }); return Object.values(g).sort((a, b) => b.count - a.count); }

function render() {
    const d = parseDs(D.date), t = todayStr(), list = D.orders;
    $('#dr-text').textContent = `${D.date === t ? 'Hôm nay' : DL[d.getDay()]}, ${pad(d.getDate())}/${pad(d.getMonth() + 1)}/${d.getFullYear()}`;
    $('#dr-date').value = D.date;
    $('#capture-date').textContent = `${DL[d.getDay()]}, ${pad(d.getDate())}/${pad(d.getMonth() + 1)}/${d.getFullYear()}`;
    const total = list.reduce((s, o) => s + (Number(o.price) || 0), 0), paid = list.filter(o => o.isPaid), paidSum = paid.reduce((s, o) => s + (Number(o.price) || 0), 0), groups = group(list);
    $('#dr-stats').innerHTML = `
    <div class="stat"><span class="lbl">Tổng đơn</span><div class="v">${list.length}</div><small>${groups.length} loại đồ uống</small></div>
    <div class="stat"><span class="lbl">Tổng tiền</span><div class="v">${money(total)}</div><small>${moneyFull(total)}</small></div>
    <div class="stat"><span class="lbl">Đã thanh toán</span><div class="v ok">${paid.length}<small style="font:500 14px var(--f-body);color:var(--muted)"> / ${list.length}</small></div><div class="progress"><b style="width:${list.length ? paid.length / list.length * 100 : 0}%"></b></div>${list.length && paid.length < list.length ? '<button class="linkbtn" id="dr-payall">Đánh dấu tất cả đã thanh toán</button>' : '<small>' + (list.length ? 'Đã thu đủ' : 'Chưa có đơn') + '</small>'}</div>
    <div class="stat"><span class="lbl">Còn phải thu</span><div class="v ${total - paidSum ? 'warnc' : ''}">${money(total - paidSum)}</div><small>${list.length - paid.length} người chưa thanh toán</small></div>`;
    const pa = $('#dr-payall'); if (pa) pa.onclick = async () => {
        const batch = db.batch(); list.filter(o => !o.isPaid).forEach(o => batch.update(col(D.date).doc(o.id), { isPaid: true }));
        try { await batch.commit(); toast('Đã đánh dấu tất cả đã thanh toán'); } catch (err) { toast('Lỗi cập nhật: ' + err.message, 'bad'); }
    };
    document.querySelectorAll('#dr-filter button').forEach(b => b.classList.toggle('on', b.dataset.f === D.filter));
    const q = D.q.trim().toLowerCase();
    const rows = list.map((o, i) => ({ o, i })).filter(({ o }) => (D.filter === 'all' || (D.filter === 'paid') === !!o.isPaid) && (!q || ((o.name || '') + ' ' + (o.drink || '') + ' ' + (o.note || '')).toLowerCase().includes(q)));
    const act = o => D.del === o.id ? `<div class="rowdel">Xóa? <button class="yes" data-dyes="${o.id}">Xóa</button><button data-dno="1">Giữ</button></div>` : `<div class="rowact"><button class="icon-btn sm" data-edit="${o.id}" title="Sửa"><span class="ms">edit</span></button><button class="icon-btn sm danger" data-del="${o.id}" title="Xóa"><span class="ms">delete</span></button></div>`;
    const pay = o => `<button class="pay ${o.isPaid ? 'yes' : 'no'}" data-pay="${o.id}" title="Bấm để đổi trạng thái"><span class="ms">${o.isPaid ? 'check_circle' : 'schedule'}</span>${o.isPaid ? 'Đã thanh toán' : 'Chưa thanh toán'}</button>`;
    const empty = !D.loaded ? '<div class="loading"><span class="ms">progress_activity</span>Đang tải đơn…</div>' : list.length ? 'Không có đơn nào khớp bộ lọc.' : 'Chưa có ai đặt đồ uống ngày này. Bấm <b>Đặt món</b> để tạo đơn đầu tiên.';
    $('#dr-body').innerHTML = rows.length ? rows.map(({ o, i }) => `<tr><td class="n">${i + 1}</td><td><b style="font-weight:600">${esc(o.name)}</b>${o.ts ? `<div class="who mono" style="font-size:12px">${fm(o.ts.getHours() * 60 + o.ts.getMinutes())}</div>` : ''}</td><td class="drink"><b>${esc(o.drink)}</b>${o.note ? `<small>${esc(o.note)}</small>` : ''}</td><td class="price">${money(o.price)}</td><td>${pay(o)}</td><td>${act(o)}</td></tr>`).join('') : `<tr><td colspan="6" class="empty" style="text-align:center;padding:32px">${empty}</td></tr>`;
    $('#dr-cards').innerHTML = rows.length ? rows.map(({ o }) => `<div class="dr-card"><div class="top"><b>${esc(o.name)}</b><span class="price">${money(o.price)}</span></div><div class="mid">${esc(o.drink)}${o.note ? `<small>${esc(o.note)}</small>` : ''}</div><div class="bot">${pay(o)}${act(o)}</div></div>`).join('') : `<p class="empty">${empty}</p>`;
    $('#tk-count').textContent = list.length ? `${list.length} ly` : '';
    $('#tk-list').innerHTML = groups.length ? groups.map(g => `<li><span class="qty">${g.count}×</span><div class="what"><b>${esc(g.name)}</b>${g.note ? `<small>${esc(g.note)}</small>` : ''}</div></li>`).join('') : `<li class="empty">Chưa có món nào để gửi quán.</li>`;
    $('#tk-text').value = `ĐƠN ĐỒ UỐNG VPT – ${pad(d.getDate())}/${pad(d.getMonth() + 1)}/${d.getFullYear()}\nTổng ${list.length} ly\n` + groups.map(g => `${g.count} × ${g.name}${g.note ? ' (' + g.note + ')' : ''}`).join('\n');
}

/* ---------- điều hướng / lọc ---------- */
function gotoDate(s) { D.date = s; subscribe(); }
$('#dr-filter').addEventListener('click', e => { const b = e.target.closest('[data-f]'); if (!b) return; D.filter = b.dataset.f; render(); });
$('#dr-q').addEventListener('input', e => { D.q = e.target.value; render(); });
$('#dr-prev').onclick = () => gotoDate(ds(addDays(parseDs(D.date), -1)));
$('#dr-next').onclick = () => gotoDate(ds(addDays(parseDs(D.date), 1)));
$('#dr-today').onclick = () => gotoDate(todayStr());
$('#dr-date').addEventListener('change', e => { if (e.target.value) gotoDate(e.target.value); });

/* ---------- thao tác trên đơn ---------- */
$('#view-drinks').addEventListener('click', async e => {
    const p = e.target.closest('[data-pay]'); if (p) { const o = D.orders.find(x => x.id === p.dataset.pay); try { await col(D.date).doc(o.id).update({ isPaid: !o.isPaid }); } catch (err) { toast('Lỗi cập nhật: ' + err.message, 'bad'); } return; }
    const ed = e.target.closest('[data-edit]'); if (ed) { openDrink(D.orders.find(x => x.id === ed.dataset.edit)); return; }
    const dl = e.target.closest('[data-del]'); if (dl) { D.del = dl.dataset.del; render(); return; }
    if (e.target.closest('[data-dno]')) { D.del = null; render(); return; }
    const y = e.target.closest('[data-dyes]'); if (y) { const o = D.orders.find(x => x.id === y.dataset.dyes); D.del = null; try { await col(D.date).doc(o.id).delete(); toast(`Đã xóa ${o.drink} của ${o.name}`); } catch (err) { toast('Lỗi xóa: ' + err.message, 'bad'); render(); } }
});
$('#tk-copy').onclick = () => {
    const tx = $('#tk-text').value;
    const ok = () => toast('Đã sao chép phiếu, dán vào Zalo gửi quán');
    const fail = () => { const ta = $('#tk-text'); ta.hidden = false; ta.focus(); ta.select(); toast('Không sao chép tự động được, hãy bôi đen nội dung bên dưới', 'warn'); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(tx).then(ok, fail); else fail();
};
$('#tk-img').onclick = () => {
    const el = $('#report-capture-area'); el.classList.add('shot'); toast('Đang tạo ảnh…');
    setTimeout(async () => {
        try {
            const bg = getComputedStyle(document.querySelector('.ticket')).backgroundColor;
            const canvas = await html2canvas(el, { scale: 2, backgroundColor: bg, useCORS: true, windowWidth: el.scrollWidth, width: el.scrollWidth, windowHeight: el.scrollHeight, height: el.scrollHeight });
            const a = document.createElement('a'); a.download = `DoUong_${D.date}.png`; a.href = canvas.toDataURL('image/png'); a.click(); toast('Đã tải ảnh phiếu');
        } catch (err) { toast('Lỗi khi tạo ảnh: ' + err.message, 'bad'); }
        el.classList.remove('shot');
    }, 300);
};
$('#dr-xlsx').onclick = () => {
    if (!D.orders.length) { toast('Không có dữ liệu để xuất.', 'warn'); return; }
    const rows = D.orders.map((o, i) => ({ 'STT': i + 1, 'Người đặt': o.name, 'Đồ uống': o.drink, 'Ghi chú': o.note || '', 'Giá': o.price, 'Đã thanh toán': o.isPaid ? 'Đã Thanh Toán' : 'Chưa Thanh Toán' }));
    const ws = XLSX.utils.json_to_sheet(rows), wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, 'DoUong'); XLSX.writeFile(wb, `ThongKeDoUong_${D.date}.xlsx`); toast('Đã xuất file Excel');
};

/* ---------- form thêm / sửa ---------- */
function openDrink(o) {
    D.edit = o ? o.id : null; const prof = store.get('mrb_drink');
    $('#dr-title').textContent = o ? 'Sửa đồ uống' : 'Thêm đồ uống'; $('#dr-submit').textContent = o ? 'Cập nhật đơn' : 'Xác nhận đặt'; $('#dr-submit').disabled = false;
    $('#dr-name').value = o ? o.name : (prof && prof.name || ''); $('#dr-drink').value = o ? o.drink : ''; $('#dr-price').value = o ? o.price : ''; $('#dr-note').value = o ? o.note || '' : '';
    ['name', 'drink', 'price'].forEach(k => { $('#dr-' + k).classList.remove('bad'); $('#dr-' + k + '-err').hidden = true; }); $('#dr-form-err').hidden = true;
    $('#dr-recent').innerHTML = D.recent.map(r => `<button type="button" data-rd="${esc(r.name)}" data-rp="${Number(r.price) || ''}">${esc(r.name)}${r.price ? ' · ' + money(r.price) : ''}</button>`).join('');
    $('#dr-notes').innerHTML = NOTE_CHIPS.map(n => `<button type="button" data-rn="${esc(n)}">${esc(n)}</button>`).join('');
    priceEcho(); $('#dr-modal').hidden = false; setTimeout(() => $(o || (prof && prof.name) ? '#dr-drink' : '#dr-name').focus(), 50);
}
function priceEcho() { const v = Number(String($('#dr-price').value).replace(/\D/g, '')) || 0; $('#dr-price-echo').textContent = v ? moneyFull(v) : ''; }
$('#dr-price').addEventListener('input', priceEcho);
$('#dr-add').onclick = () => openDrink(null);
$('#dr-modal').addEventListener('click', e => {
    if (e.target.closest('[data-dclose]')) { $('#dr-modal').hidden = true; return; }
    const r = e.target.closest('[data-rd]'); if (r) { $('#dr-drink').value = r.dataset.rd; if (!$('#dr-price').value && r.dataset.rp) $('#dr-price').value = r.dataset.rp; priceEcho(); $('#dr-price').focus(); return; }
    const n = e.target.closest('[data-rn]'); if (n) { const i = $('#dr-note'); i.value = i.value ? (i.value.toLowerCase().includes(n.dataset.rn.toLowerCase()) ? i.value : i.value + ', ' + n.dataset.rn) : n.dataset.rn; }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#dr-modal').hidden) $('#dr-modal').hidden = true; });
$('#dr-form').addEventListener('submit', async e => {
    e.preventDefault();
    const name = $('#dr-name').value.trim().replace(/\s+/g, ' '), drink = $('#dr-drink').value.trim(), price = Number(String($('#dr-price').value).replace(/\D/g, '')), note = $('#dr-note').value.trim();
    let bad = false; [['name', !name], ['drink', !drink], ['price', !price]].forEach(([k, no]) => { $('#dr-' + k).classList.toggle('bad', no); $('#dr-' + k + '-err').hidden = !no; if (no && !bad) { $('#dr-' + k).focus(); bad = true; } });
    if (bad) return;
    const btn = $('#dr-submit'); btn.disabled = true; $('#dr-form-err').hidden = true;
    try {
        if (D.edit) { await col(D.date).doc(D.edit).update({ name, drink, note, price, addedBy: name }); toast('Đã cập nhật đơn'); }
        else { await col(D.date).add({ name, drink, note, price, isPaid: false, addedBy: name, timestamp: firebase.firestore.FieldValue.serverTimestamp() }); toast(`Đã thêm ${drink} cho ${name}`); }
        store.set('mrb_drink', { name }); $('#dr-modal').hidden = true;
        if (!D.recent.find(r => r.name.toLowerCase() === drink.toLowerCase())) D.recent.unshift({ name: drink, n: 1, price });
    } catch (err) { $('#dr-form-err').hidden = false; $('#dr-form-err').textContent = 'Lỗi lưu dữ liệu: ' + err.message; }
    btn.disabled = false;
});

subscribe(); loadRecent();
</script>
</body>
</html>
